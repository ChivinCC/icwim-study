he Answer is C\nThe model explicitly relies on discounting future cash flows (dividends) to determine the\ntheoretical share price.\nWhy Other Options are Incorrect\nA. Net asset value: Focuses on book value, not cash flows.\nB. Market value added: Measures value creation over invested capital, unrelated to theoretical\nshare pricing.\nD. Economic value added: Measures performance based on excess returns, not share valuation.\nICWIM Study Guide, Chapter on Equity Valuation: Explains the DVM and its mechanics.\nValuation Literature: Highlights DVM’s use in share pricing.\nReferences", "zh": "将公司无限期预期现金流折现为理论股价，描述哪种模型？", "optionsZh": ["净资产值", "市场增加值", "股息估值模型", "经济增加值"], "explanationZh": "原解析把现金流具体理解为未来股息，折现后求和确定理论股价。", "warning": ""}, {"id": 66, "q": "Having prepared recommendations via a report, why would an adviser suggest a face-to-face meeting with their client?", "options": ["In order to collect fees prior to implementation of the recommendations", "To establish the client's tax position", "So that the client can review the adviser's qualifications", "To afford the opportunity to clear up any misunderstandings"], "answer": 3, "explanation": "A face-to-face meeting ensures that clients fully understand recommendations and can ask questions to\nclarify any doubts.\nWhy is Option D Correct?\nComplex financial products require explanations in simple terms.\nClients may have concerns about risk, fees, or investment strategy.\nRegulatory bodies (e.g., FCA) emphasize client understanding in financial advice.\nWhy Not Other Options?\nA (Collect fees) # Fees must be disclosed before services are provided.\nB (Establish tax position) # This should be determined before making recommendations.\nC (Review adviser qualifications) # While qualifications matter, the main purpose is clarity.\n# Reference: FCA Handbook (Suitability & Client Communications), CISI Wealth & Investment\nManagement.", "zh": "提交建议报告后，为何安排与客户面谈？", "optionsZh": ["实施前收取费用", "确定客户税务情况", "让客户查看顾问资格", "澄清误解"], "explanationZh": "面谈让客户提问并理解产品、风险、收费和投资策略。", "warning": ""}, {"id": 67, "q": "What fiduciary responsibility does a financial adviser have for their clients?", "options": ["Decrease the overall risk of their portfolio", "Provide their services at a competitive fee", "Act in the best interests of their clients", "Offer conservative advice with low risk"], "answer": 2, "explanation": "A fiduciary duty requires a financial adviser to prioritise the client’s best interests above their own.\nCore Responsibilities:\nAct with integrity and transparency when providing financial advice.\nProvide suitable recommendations based on the client’s risk profile, objectives, and financial\nsituation.\nAvoid conflicts of interest (or disclose them).\nRegulatory Requirement: The FCA and MiFID II mandate that advisers act in a client’s best\ninterests when offering financial services.\n# Reference: FCA Handbook (Principles for Businesses - Principle 6), CISI Code of Conduct.", "zh": "顾问对客户承担什么受托责任？", "optionsZh": ["降低组合全部风险", "提供有竞争力的收费", "以客户最佳利益行事", "只提供低风险保守建议"], "explanationZh": "受托责任强调客户利益优先，建议须符合其目标及财务状况，而非一概选择最低风险。", "warning": ""}, {"id": 68, "q": "Treasury bills are normally issued with a minimum maturity of:", "options": ["1 month", "3 months", "1 year", "3 years"], "answer": 1, "explanation": "Treasury Bills Defined\nTreasury bills (T-bills) are short-term government debt securities issued at a discount and\nredeemed at face value at maturity.\nThey are typically issued with maturities of 3 months (most common), 6 months, and 1 year.\nWhy the Answer is B\nWhile T-bills can have shorter or longer maturities, 3 months is the standard minimum maturity\nfor most markets, including the UK and US.\n\n\n\nICWIM Study Guide, Chapter on Fixed Income Securities: Covers treasury bill characteristics.\nDebt Market Literature: Confirms typical T-bill maturities.\nReferences", "zh": "国库券通常最短发行期限是多久？", "optionsZh": ["1 个月", "3 个月", "1 年", "3 年"], "explanationZh": "原解析选择三个月，但又承认存在更短期限；发行期限随市场而异，此题缺少国家及制度背景。", "warning": "国库券最短期限因发行市场而异，不能把三个月作为普遍最低期限。"}, {"id": 69, "q": "How do imports and exports affect the Gross Domestic Product (GDP) calculation?", "options": ["Imports and exports are ignored as they only affect Gross National Product (GNP)", "Exports are added and imports are ignored", "Imports are subtracted and exports are added", "Imports are added and exports are subtracted"], "answer": 2, "explanation": "GDP Formula\nGDP=C+I+G+(X#M)\\text{GDP} = C + I + G + (X - M)GDP=C+I+G+(X#M)\nWhere:\nCCC: Consumption\nIII: Investment\nGGG: Government spending\nXXX: Exports\nMMM: Imports\nWhy Imports Are Subtracted and Exports Are Added\nExports represent goods produced domestically and sold abroad, contributing to domestic\nproduction (added to GDP).\nImports are goods produced abroad and consumed domestically, reducing domestic production\n(subtracted from GDP).\nWhy the Answer is C\nThe formula directly supports adding exports and subtracting imports.\n\n\n\nICWIM Study Guide, Chapter on Economic Indicators: Explains the GDP formula and its components.\nMacroeconomics Textbooks: Confirms the impact of imports and exports on GDP.\nReferences", "zh": "进出口如何计入 GDP？", "optionsZh": ["均忽略，只影响 GNP", "加出口，忽略进口", "减进口，加出口", "加进口，减出口"], "explanationZh": "支出法 GDP＝消费＋投资＋政府支出＋出口－进口。", "warning": ""}, {"id": 70, "q": "Your client estimates that they will require £50,000 of income annually to live off when they retire. Personal plus state pension will provide £40,000. They wish to retire in 25 years’ time. It is estimated that they can earn 5% per annum, and inflation has been forecast at 2%. Interest rates are currently 1.5%. Allowing for inflation, what lump sum would they need to accrue to supplement their pension?", "options": ["£252,401", "£328,120", "£468,745", "£546,869"], "answer": 1, "explanation": "To calculate the required lump sum, we need to determine the present value (PV) of future withdrawals,\nadjusted for inflation and investment growth.\n\n\n\nA screenshot of a paper AI-generated content may be incorrect.\n[Original contains a formula image. Refer to the source PDF for that image.]", "zh": "退休每年需 5 万英镑，养老金提供 4 万；25 年后退休，回报率 5%、通胀 2%、现行利率 1.5%。考虑通胀需积累多少补充资金？", "optionsZh": ["£252,401", "£328,120", "£468,745", "£546,869"], "explanationZh": "原题选择 B。原解析的关键计算以图片呈现；按年缺口 10,000×1.02^25÷0.05 约得 328,121。题目未完整说明退休后提款期限等假设。", "warning": "计算依赖年缺口通胀调整、收益率及资本保全等简化假设，原解析关键公式是图片。"}, {"id": 71, "q": "What is the main source of funding for private equity firms?", "options": ["Institutional investment", "Management buyouts", "Initial public offerings", "Placings"], "answer": 0, "explanation": "Private equity firms raise capital primarily from institutional investors such as pension funds, insurance\ncompanies, and sovereign wealth funds.\nWhy is Option A Correct?\nInstitutional investors provide large capital commitments for private equity funds.\n\n\n\nPrivate equity firms pool these funds to acquire and restructure companies.\nWhy Not Other Options?\nB (Management buyouts) # A buyout strategy, not a funding source.\nC (Initial public offerings, IPOs) # Private equity firms exit investments through IPOs, but\nthis is not a funding source.\nD (Placings) # Common in public equity markets, not private equity.\n# Reference: CFA Institute (Private Equity Structures), CISI Wealth & Investment Management.", "zh": "私募股权机构的主要资金来源是什么？", "optionsZh": ["机构投资", "管理层收购", "首次公开发行", "配售"], "explanationZh": "养老金、保险公司、主权基金等机构投资者向私募股权基金承诺资本。", "warning": ""}, {"id": 72, "q": "In normal market circumstances, the yield curve slopes upward. Why is this?", "options": ["Longer-dated bonds are generally more sensitive to interest rate changes than short-dated bonds because holders are exposed to risk for a longer period", "As long as the interest being paid on the government bond is near to the interest rate available on the market, there is little risk that the resale value will be significantly different from the purchase price", "The longer an investor ties up capital, the higher the rate of interest they will demand to compensate themselves for the greater risk and opportunity cost on the capital they have invested", "Although bonds are generally less risky than equities, their prices are intrinsically linked to the general level of interest rates and expectations of future changes"], "answer": 2, "explanation": "The yield curve typically slopes upward because long-term bonds have higher yields than short-term\nbonds.\nWhy is Option C Correct?\nInvestors require a higher return (yield) for longer-maturity bonds due to:\nGreater risk exposure (inflation, interest rate changes).\nOpportunity cost (capital is locked up for a longer period).\nThis creates an upward-sloping yield curve.\nWhy Not Other Options?\nA (Interest rate sensitivity) # While true, it does not explain why the curve slopes upwards.\n\n\n\nB (Resale value risk) # Not a key factor in yield curve structure.\nD (Bond-equity risk comparison) # Bonds react to interest rate expectations, but this does not\ncause the yield curve slope.\n# Reference: CFA Institute (Fixed Income Markets), CISI Wealth & Investment Management.", "zh": "正常情况下收益率曲线为何向上？", "optionsZh": ["长期债券对利率更敏感", "票息接近市场利率时转售风险较低", "锁定资金越久，要求补偿风险和机会成本的利率越高", "债券价格与利率及预期变化相关"], "explanationZh": "原解析强调投资者要求期限较长的资金占用获得更多补偿。", "warning": ""}, {"id": 73, "q": "A firm acting as an agent makes money by:", "options": ["Profiting from the spread", "Providing advice", "Charging their client a commission", "Trading against its own order book"], "answer": 2, "explanation": "When a firm acts as an agent, it executes trades on behalf of clients and earns a commission for each\ntransaction.\nWhy is Option C Correct?\nAgents do not take ownership of securities but facilitate transactions.\nThey charge a fixed fee or percentage-based commission for each trade executed.\nWhy Not Other Options?\nA (Profiting from the spread) # Market makers profit from bid-ask spreads, not agents.\nB (Providing advice) # Advice is provided by investment advisers, not agents.\nD (Trading against its own order book) # Agents do not take opposing positions; this applies\nto principal trading.\n# Reference: FCA Handbook (Market Conduct Rules), CISI Wealth & Investment Management.", "zh": "代理人模式的公司如何获得收入？", "optionsZh": ["价差", "提供建议", "客户佣金", "自营账簿交易"], "explanationZh": "代理人替客户执行并收取佣金，不是以自有资本交易赚价差。", "warning": ""}, {"id": 74, "q": "How would an active fund manager seek to avoid underperforming their peer group when deciding on asset allocation?", "options": ["Through the use of asset allocation by consensus", "By assessing the prospects for each main asset class", "By hedging currency and market risk", "Through the use of quantitative models"], "answer": 0, "explanation": "Active Fund Management\nActive fund managers aim to outperform or avoid underperforming their peers by dynamically\nmanaging asset allocation.\nAsset allocation by consensus ensures alignment with the strategies and expectations of the\nbroader investment community, minimizing the risk of significant divergence from the peer\ngroup.\nWhy the Answer is A\nUsing consensus-driven allocation avoids extreme deviations in performance relative to peers,\nwhich is key for managers seeking to maintain competitive performance.\nWhy Other Options are Incorrect\nB. Assessing prospects: This involves market analysis but does not specifically address peer\nperformance.\nC. Hedging risks: Focuses on risk management, not peer alignment.\nD. Quantitative models: Useful for analysis but not tailored to peer group considerations.\nICWIM Study Guide, Chapter on Portfolio Management: Discusses consensus-driven asset allocation.\nActive Fund Management Literature: Highlights peer-relative performance strategies.\nReferencesThus, the correct answer is A. Through the use of asset allocation by consensus.", "zh": "主动经理怎样在配置资产时避免落后同业？", "optionsZh": ["采用共识资产配置", "评估各资产类别前景", "对冲汇率和市场风险", "使用量化模型"], "explanationZh": "原解析强调跟随同业共识配置可减少相对同业的偏离；不保证实际不会落后。", "warning": ""}, {"id": 75, "q": "It is a regulatory requirement for financial advisers to explain any potential additional obligations for clients making a transaction in:", "options": ["Bonds", "Commodities", "Derivatives", "Equities"], "answer": 2, "explanation": "Derivatives (e.g., options, futures, swaps) carry high complexity and risk, requiring financial advisers to\ndisclose additional obligations under regulatory guidelines.\nWhy Required?\nHigh Leverage Risk: Clients may lose more than their initial investment.\nMargin Calls: Clients may be required to add additional funds if the position moves against\nthem.\nComplex Nature: Not all retail investors understand derivative pricing and risk exposure.\nRegulation: The FCA Conduct of Business Sourcebook (COBS 14) requires full disclosure for\nderivative products.\n# Reference: FCA Handbook (COBS 14), CISI Wealth & Investment Management.", "zh": "交易哪类产品时，顾问需说明潜在额外义务？", "optionsZh": ["债券", "商品", "衍生品", "股票"], "explanationZh": "衍生品可能涉及杠杆、追加保证金或其他履约义务，需要解释相关风险。", "warning": ""}, {"id": 76, "q": "An investor deposits £1,000 into an account that pays 3% per annum. If interest is compounded annually, how much will be in the account after 5 years?", "options": ["£1,150.00", "£1,157.63", "£1,159.27", "£1,276.28"], "answer": 2, "explanation": "# Reference: Compound Interest Formula, CISI Wealth & Investment Management.", "zh": "存入 1,000 英镑，年利率 3%，按年复利，5 年后多少钱？", "optionsZh": ["£1,150.00", "£1,157.63", "£1,159.27", "£1,276.28"], "explanationZh": "原题答案标 C，但 1000×1.03^5＝1159.274…，与 C 一致。第 102 题相同计算却标 B，存在答案冲突。", "warning": "本题计算对应 C；第 102 题相同数据却标 B，原题库答案冲突。"}, {"id": 77, "q": "ROCE can be used to establish which of the following?", "options": ["The net profitability of the business", "Impact of borrowing costs on company performance", "Returns generated from capital invested in the business", "Net profit in relation to the cost of sales"], "answer": 2, "explanation": "ROCE (Return on Capital Employed)\nMeasures the efficiency and profitability of a company relative to the capital invested in the\nbusiness.\nFormula: ROCE=Earnings Before Interest and Tax (EBIT)Capital Employed\\text{ROCE} = \\frac\n{\\text{Earnings Before Interest and Tax (EBIT)}}{\\text{Capital Employed}}\nROCE=Capital EmployedEarnings Before Interest and Tax (EBIT)\nWhy the Answer is C\nROCE specifically focuses on the returns generated from the capital base, providing insight into\nhow effectively the business is using its resources.\nWhy Other Options are Incorrect\nA. Net profitability: Refers to net profit margins, not ROCE.\nB. Borrowing costs: ROCE ignores borrowing costs as it considers EBIT.\nD. Net profit in relation to cost of sales: Refers to gross profit margin, not ROCE.\nICWIM Study Guide, Chapter on Financial Ratios: Covers ROCE and its applications.\nCorporate Finance Texts: Defines ROCE as a key performance metric.\nReferencesThus, the correct answer is C. Returns generated from capital invested in the business.", "zh": "ROCE 可以衡量什么？", "optionsZh": ["企业净盈利", "借款成本对业绩的影响", "投入企业资本产生的回报", "净利润与销售成本比例"], "explanationZh": "ROCE＝息税前利润÷已运用资本，用于衡量资本使用效率。", "warning": ""}, {"id": 78, "q": "A fiduciary relationship normally arises between:", "options": ["A husband and wife", "A lawyer and client", "A company and its suppliers", "A head of state and its government"], "answer": 1, "explanation": "# Reference: CISI Code of Ethics, CFA Standards of Professional Conduct.", "zh": "受托关系通常出现在哪两方之间？", "optionsZh": ["夫妻", "律师与客户", "公司与供应商", "国家元首与政府"], "explanationZh": "原题选择律师与客户，强调专业人士承担忠诚和客户利益优先义务。", "warning": ""}, {"id": 79, "q": "What is the first action an adviser takes to ensure that their advice is suitable for a client?", "options": ["Offer the client a range of options", "Draw attention to the cancellation period", "Gather sufficient information from the client", "Ensure recommendations are confirmed by a third party"], "answer": 2, "explanation": "The first step in financial planning is to gather sufficient client information before making any\nrecommendations.\nKey Information Required:\nIncome, expenses, and financial goals.\nRisk tolerance and investment horizon.\nTax status and personal circumstances.\nRegulatory Requirement:\nThe FCA's suitability rules mandate that advisers perform a full fact-finding process before\noffering advice.\n# Reference: FCA Handbook (COBS 9 - Suitability), CISI Wealth & Investment Management.", "zh": "确保建议适合客户的第一步是什么？", "optionsZh": ["提供一系列选项", "提示撤销期", "收集充分客户资料", "让第三方确认建议"], "explanationZh": "先了解目标、收入支出、期限、风险承受和财务情况，再提出建议。", "warning": ""}, {"id": 80, "q": "Why should standard deviation, as a measure of volatility, not be used on its own?", "options": ["Because the data is difficult to interpret", "Standard deviation only works for small fluctuations", "Because it cannot be used to compare all assets", "The data is historic"], "answer": 3, "explanation": "Standard deviation is a widely used measure of volatility, but it has a significant limitation: it is based on\npast data, which may not reflect future risks.\nKey Limitations of Standard Deviation:\nIt only measures historical price fluctuations, not future risks.\nIt assumes normal distribution, which may not hold in financial markets.\nIt does not distinguish between upside and downside volatility.\nAlternative Measures of Risk:\nValue at Risk (VaR) – Estimates potential losses under extreme market conditions.\nBeta – Measures risk relative to the overall market.\nSharpe Ratio – Assesses risk-adjusted returns.\n# Reference: CFA Institute (Risk Metrics), CISI Wealth & Investment Management.", "zh": "为何不应只用标准差衡量风险？", "optionsZh": ["数据难理解", "只适合小幅波动", "不能比较所有资产", "数据是历史的"], "explanationZh": "原解析强调历史波动不能完整代表未来风险，也不能覆盖全部风险维度。", "warning": ""}, {"id": 81, "q": "Which of the following elements would be included in a recommendation report to a client?", "options": ["Inflation rate", "Interest rate", "Protection", "Previous arrangements"], "answer": 3, "explanation": "A recommendation report (or suitability report) is a formal document provided by financial advisers to\nclients. It outlines investment recommendations and justifications based on the client’s personal\ncircumstances.\nWhy is Option D Correct?\nThe FCA requires firms to consider a client’s existing investments, pensions, and insurance\npolicies before making recommendations.\nThis ensures that clients are not sold duplicate or unsuitable products.\nReviewing previous arrangements helps advisers identify gaps in financial planning.\nWhat Else Is Included in a Recommendation Report?\nInvestment objectives & risk tolerance.\nTax considerations.\nCost disclosures and fees.\nWhy Not Other Options?\nA (Inflation rate) # While inflation is considered, it is not a mandatory section in suitability\nreports.\nB (Interest rate) # Relevant for fixed income investments, but not always necessary.\nC (Protection) # Only included if insurance products are being recommended.\n# Reference: FCA Conduct of Business Sourcebook (COBS 9 – Suitability Reports), CISI Wealth &\nInvestment Management.", "zh": "客户建议报告应包括什么？", "optionsZh": ["通胀率", "利率", "保障", "已有安排"], "explanationZh": "原解析选择已有财务安排，以免重复配置或忽视现有投资、保险和养老金。", "warning": ""}, {"id": 82, "q": "The Efficient Market Hypothesis (EMH) states that it is impossible to beat the market because:", "options": ["Fund managers already perform at optimum levels", "All relevant information is in the price", "Investors do not always invest in a rational fashion", "Not all participants can interpret information correctly"], "answer": 1, "explanation": "# Reference: Eugene Fama (EMH Theory), CISI Wealth & Investment Management.", "zh": "有效市场假说为什么认为难以战胜市场？", "optionsZh": ["经理已达最优", "所有相关信息已反映在价格中", "投资者不总理性", "并非所有人能理解信息"], "explanationZh": "原题强调信息已被价格吸收。不同形式有效市场假说对应不同信息范围。", "warning": ""}, {"id": 83, "q": "If two sets of data have a correlation coefficient of 1.0, they possess:", "options": ["No correlation", "Weak correlation", "Perfect negative correlation", "Perfect positive correlation"], "answer": 3, "explanation": "Correlation Coefficient of 1.0:\nA correlation coefficient measures the strength and direction of the relationship between two\ndatasets.\nA value of 1.0 indicates a perfect positive correlation, meaning the two sets of data move in the\nsame direction proportionally.\nElimination of Other Options:\nA: A value of 0 indicates no correlation.\nB: Weak correlation would be closer to 0.\nC: Perfect negative correlation has a value of -1.\nReferences:\nICWIM Module 3: Concepts of statistical measures, including correlation.", "zh": "两组数据相关系数为 1.0，代表什么？", "optionsZh": ["无相关", "弱相关", "完全负相关", "完全正相关"], "explanationZh": "+1 表示完全正相关，−1 表示完全负相关。", "warning": ""}, {"id": 84, "q": "The UCITS regulations have been integral to introducing a common format for:", "options": ["Company accounts", "Corporate actions", "Key investor information documents", "Trade settlement"], "answer": 2, "explanation": "The UCITS (Undertakings for the Collective Investment in Transferable Securities) regulations mandate\nthat fund managers provide a standardized Key Investor Information Document (KIID) to investors. This\ndocument ensures that all retail investors receive clear and concise information about the fund’s objectives,\nrisks, charges, and past performance.\nCompany accounts (A): UCITS does not govern corporate accounting.\nCorporate actions (B): Corporate actions such as dividends or mergers are unrelated to UCITS.\nTrade settlement (D): UCITS does not standardize trade settlement processes.\nReferences:\nInternational Certificate in Wealth & Investment Management: Regulations surrounding UCITS and\nKIIDs.\nUCITS directives and their implementation across the European Union.", "zh": "UCITS 推动哪项文件格式统一？", "optionsZh": ["公司账目", "公司行动", "关键投资者信息文件", "交易结算"], "explanationZh": "原题采用 KIID 框架，强调统一披露投资目标、风险、收费等；文件制度可能随地区和时间变化。", "warning": ""}, {"id": 85, "q": "When a UK-based investor receives overseas equity dividend income, which one of the following types of tax may have been deducted?", "options": ["Stamp Duty", "Withholding Tax", "Value Added Tax", "UK Corporation Tax"], "answer": 1, "explanation": "Withholding tax is a tax deducted at source on dividends, interest, and royalty payments before they are\npaid to non-residents.\nTaxation on Foreign Dividends: Investors receiving dividends from foreign companies may have tax\ndeducted by the source country before the net dividend is paid.\nDouble Taxation Relief: Many countries have Double Taxation Agreements (DTA) with the UK,\nallowing UK investors to claim relief against withholding tax.\n\n\n\nStamp Duty & VAT Irrelevance: Stamp Duty applies to purchases of shares, and VAT does not\napply to dividends.\n# Reference: HMRC Double Taxation Agreements, CISI Wealth & Investment Management.", "zh": "英国投资者收到海外股息，可能已扣哪种税？", "optionsZh": ["印花税", "预扣税", "增值税", "英国公司税"], "explanationZh": "来源国可能在派息时预扣税款，税收协定可能提供减免。", "warning": ""}, {"id": 86, "q": "The management of investment portfolios of collective investment schemes, pension funds, insurance funds, hedge funds, and private equity would normally be considered to fall into the scope of:", "options": ["The retail financial sector", "The wholesale financial sector", "Family offices", "Private banking"], "answer": 1, "explanation": "Wholesale Financial Sector Defined\nInvolves large-scale financial transactions and services for institutions like pension funds, hedge\nfunds, and insurance funds.\nWhy the Answer is B\nManaging portfolios of collective investment schemes and large funds is a hallmark of the\nwholesale sector, focused on institutional rather than retail clients.\nWhy Other Options are Incorrect\nA. Retail financial sector: Caters to individual clients, not institutional portfolios.\nC. Family offices: Focus on managing wealth for high-net-worth families.\nD. Private banking: Primarily deals with individual high-net-worth clients.\nICWIM Study Guide, Chapter on Financial Market Segments: Differentiates wholesale and retail\nsectors.\nInvestment Management Literature: Describes wholesale services.\nReferences", "zh": "管理基金、养老金、保险、对冲基金及私募股权组合，通常属于什么领域？", "optionsZh": ["零售金融", "批发金融", "家族办公室", "私人银行"], "explanationZh": "原解析将大规模机构投资管理归入批发金融，而非针对个人的零售服务。", "warning": ""}, {"id": 87, "q": "Which one of the following is true of fundamental analysis? It seeks to establish:", "options": ["Long-term price trends of a security", "Long-term volume trends of a security", "The momentum of share prices", "The intrinsic value of a security"], "answer": 3, "explanation": "Fundamental analysis involves evaluating a security to determine its intrinsic value by examining factors such\nas financial statements, economic conditions, and industry trends. The goal is to identify whether the security\nis undervalued or overvalued compared to its current market price.", "zh": "基本面分析试图确定什么？", "optionsZh": ["证券长期价格趋势", "长期成交量趋势", "股价动量", "证券内在价值"], "explanationZh": "通过财务报表、经济及行业情况评估内在价值，与市场价格比较。", "warning": ""}, {"id": 88, "q": "An economy with two consecutive quarters of negative growth is considered to be in what phase of the economic cycle?", "options": ["Recession", "Slump", "Depression", "Inflationary"], "answer": 0, "explanation": "A recession is defined as two consecutive quarters of negative GDP growth. It represents an economic\ndownturn where output, income, and employment decline.\nKey Characteristics of a Recession:\nFalling GDP – Two successive quarters of contraction.\nRising Unemployment – Businesses cut jobs due to weak demand.\nDeclining Consumer Spending – Households reduce purchases.\nLower Business Investment – Firms delay expansion plans.\nDifference Between Recession and Depression:\n\n\n\nA depression is a severe and prolonged recession (e.g., the Great Depression of 1929).\n# Reference: UK Office for National Statistics (ONS) GDP Reports, CISI Wealth & Investment Management\n(Economic Cycles).", "zh": "连续两个季度负增长属于什么经济阶段？", "optionsZh": ["衰退", "低迷", "萧条", "通胀阶段"], "explanationZh": "原题采用连续两个季度 GDP 收缩的衰退简化判据。", "warning": ""}, {"id": 89, "q": "Which of the following types of funds is able to cancel units?", "options": ["Investment trust", "Split capital trust", "Open-ended", "Closed-ended"], "answer": 2, "explanation": "An open-ended fund can create or cancel units based on investor demand.\nLiquidity: Open-ended funds, such as Unit Trusts and OEICs (Open-Ended Investment\nCompanies), continuously issue and redeem shares.\nPricing: The price is based on the Net Asset Value (NAV).\nFlexibility: The fund manager can adjust the fund size by issuing or cancelling units.\n# Reference: FCA Handbook, CISI Wealth & Investment Management (Fund Structures).", "zh": "哪种基金可以注销份额？", "optionsZh": ["投资信托", "分割资本信托", "开放式", "封闭式"], "explanationZh": "开放式基金可以随申购发行份额、随赎回注销份额。", "warning": ""}, {"id": 90, "q": "Which of the following instruments is currently outside of those covered by insider dealing rules?", "options": ["Bonds", "Commodities", "Depositary Receipts", "Warrants"], "answer": 1, "explanation": "Commodities (e.g., gold, oil, agricultural products) are not covered by insider dealing regulations, as\nthey are physical assets rather than securities.\nWhy Are Commodities Exempt?\nInsider trading laws apply to securities markets, not physical goods.\nPrice movements in commodities are driven by supply and demand, not company disclosures.\nRegulation of Commodities:\nWhile insider trading rules don’t apply, market manipulation laws still govern commodities (e.\ng., FCA MAR rules).\n# Reference: FCA Market Abuse Regulation (MAR), CISI Wealth & Investment Management.", "zh": "以下哪项目前不在内幕交易规则覆盖范围内？", "optionsZh": ["债券", "商品", "存托凭证", "认股权证"], "explanationZh": "原题选择商品，但没有说明司法辖区、规则和时点；不能据此断言商品及其衍生品普遍不受内幕交易规则约束。", "warning": "内幕交易法规依司法辖区与产品而异，不能泛化到所有商品及其衍生品。"}, {"id": 91, "q": "Your client estimates that they will require £40,000 of income annually to live off when they retire. Personal plus state pension will provide £35,000. They wish to retire in 20 years' time. It is estimated that they can earn 3% per annum and inflation has been forecast at 2% over the next 20 years. Interest rates are currently 1.5%. Allowing for inflation, what lump sum would they need to accrue to supplement their pension?", "options": ["£165,105", "£247,658", "£331,631", "£495,316"], "answer": 2, "explanation": "Determine the shortfall in income:\nDesired income: £40,000\nPension provided: £35,000\nAnnual shortfall: £40,000 - £35,000 = £5,000\nAdjust for inflation over 20 years:Future value = Present Value × (1 + Inflation Rate)^n£5,000 × (1 +\n0.02)^20 = £7,430 (inflation-adjusted shortfall)\nCalculate the lump sum required to generate this shortfall:Use the real rate of return formula: (1 +\nnominal return) ÷ (1 + inflation rate) - 1Real rate of return = (1 + 0.03) ÷ (1 + 0.02) - 1 = 0.98% per year\n\n\n\nUse the present value of annuity formula:PV = PMT × [(1 - (1 + r)^-n) ÷ r]PV = £7,430 × [(1 - (1 + 0.0098)^-\n20) ÷ 0.0098]PV = £7,430 × 44.64 = £331,631", "zh": "退休每年需 4 万英镑，养老金 3.5 万；20 年后退休，回报 3%、通胀 2%、现行利率 1.5%。需积累多少补充资金？", "optionsZh": ["£165,105", "£247,658", "£331,631", "£495,316"], "explanationZh": "原题选 C。原解析先算 5000×1.02^20 的年缺口，再使用实际回报率；其计算与选项匹配存在疑点，暂不把 C 当成已验证答案。", "warning": "原解析计算与选项匹配存在疑点，且退休提款模型假设不充分。"}, {"id": 92, "q": "Mortgage protection can assist when:", "options": ["Property prices rise very quickly", "Interest rates rise, increasing the cost of mortgage payments", "Illness may prevent the main wage earner from meeting mortgage payments", "Property prices collapse"], "answer": 2, "explanation": "Mortgage protection insurance (MPI) is designed to cover mortgage payments in case of unexpected life\nevents, such as illness or death of the primary earner.\nWhy is Option C Correct?\nIf the main wage earner falls ill or dies, MPI ensures the mortgage is paid so that their family\ndoes not lose their home.\nWhy Not Other Options?\nA (Property prices rise) # Property price increases do not affect mortgage repayments.\nB (Interest rates rise) # While rising rates increase mortgage costs, MPI does not cover rate\nchanges.\nD (Property price collapse) # MPI does not protect against declining property values.\n# Reference: CISI Wealth & Investment Management (Protection Planning), FCA Mortgage Market Review\n(MMR).", "zh": "住房按揭保障可在何种情况下提供帮助？", "optionsZh": ["房价急涨", "利率上升使还贷成本增加", "主要收入者患病而无法还贷", "房价崩跌"], "explanationZh": "原解析指疾病等事件造成收入中断时的还贷保障，不是保障房价或利率变化。", "warning": ""}, {"id": 93, "q": "An inherent disadvantage with a defined contribution pension scheme is that:", "options": ["The level of retirement income is not known before retirement", "Employers never contribute to the scheme", "Gains within the scheme are subject to capital gains tax", "Employees always have to contribute more than employers"], "answer": 0, "explanation": "A Defined Contribution (DC) pension scheme is a retirement savings plan where contributions are\ninvested, and the final pension depends on investment performance.\nWhy is Option A Correct?\nThe final retirement income is uncertain because it depends on investment returns,\ncontribution levels, and annuity rates at retirement.\nUnlike Defined Benefit (DB) schemes, where retirees receive a fixed pension, DC schemes do\nnot guarantee a set payout.\nHow Defined Contribution (DC) Schemes Work:\nContributions are made by employees (and often by employers).\nFunds are invested in stocks, bonds, or mixed assets.\nUpon retirement, the individual may withdraw lump sums, purchase an annuity, or opt for\npension drawdown.\nWhy Not Other Options?\nB (Employers never contribute) # Incorrect. Many employers do contribute, particularly in\nworkplace pensions (e.g., auto-enrolment in the UK).\nC (Capital gains tax applies) # Incorrect. Pension funds grow tax-free (no CGT on gains).\nD (Employees always contribute more) # Incorrect. Employer contributions vary by scheme—\nsome match employee contributions, others contribute less.\n# Reference: UK Pensions Act 2008 (Auto-Enrolment), FCA Pension Regulations, CISI Wealth &\nInvestment Management.", "zh": "确定缴费型养老金的固有缺点是什么？", "optionsZh": ["退休前不能确定退休收入", "雇主从不缴费", "计划内收益缴资本利得税", "员工缴费总比雇主多"], "explanationZh": "最终退休收入取决于缴费、投资表现和退休时的安排，不像确定给付型按预定规则提供收入。", "warning": ""}, {"id": 94, "q": "If a hedge fund is engaging in equity arbitrage, it is likely that they are pursuing:", "options": ["An absolute return strategy", "A market-neutral strategy", "An event-driven strategy", "A non-directional strategy"], "answer": 1, "explanation": "Equity Arbitrage and Hedge Funds:\nEquity arbitrage involves taking offsetting positions in related equity securities to profit from\nprice differentials.\nA market-neutral strategy eliminates overall market risk by balancing long and short positions,\nfocusing on relative price movements rather than market direction.\nElimination of Other Options:\nA: Absolute return aims for consistent returns regardless of market conditions but is not specific\nto equity arbitrage.\nC: Event-driven strategies target corporate events (e.g., mergers), not arbitrage.\nD: Non-directional is a general description but lacks specificity compared to market-neutral.\nReferences:\nICWIM Module 3: Coverage of hedge fund strategies and market neutrality.", "zh": "股票套利对冲基金可能采用什么策略？", "optionsZh": ["绝对收益", "市场中性", "事件驱动", "非方向性"], "explanationZh": "原解析选择市场中性，利用多空头寸降低市场方向风险。", "warning": ""}, {"id": 95, "q": "Ex-ante security attribution seeks to identify:", "options": ["Portfolio outperformance", "Why the portfolio performed the way it did", "An appropriate benchmark", "Future risks"], "answer": 3, "explanation": "Ex-ante attribution focuses on predicting future risks and returns, whereas ex-post attribution analyzes\npast performance.\nWhy is Option D Correct?\nEx-ante means “before the event”, so it identifies potential risks before they impact returns.\n\n\n\nUsed in risk forecasting and portfolio stress testing.\nWhy Not Other Options?\nA & B (Portfolio outperformance, past performance) # These relate to ex-post (historical)\nattribution.\n# Reference: CFA Institute (Performance Attribution), CISI Wealth & Investment Management.", "zh": "事前证券归因分析试图识别什么？", "optionsZh": ["组合超额表现", "历史表现原因", "适当基准", "未来风险"], "explanationZh": "Ex-ante 强调前瞻性风险来源，区别于解释历史回报的事后分析。", "warning": ""}, {"id": 96, "q": "A fund manager would be keen to improve the alpha of a fund because:", "options": ["It has not outperformed the benchmark", "The fund will be easier to manage", "As alpha improves, so does beta", "It will become more attractive to risk-averse clients"], "answer": 0, "explanation": "Alpha (#) measures a fund’s excess return relative to its benchmark. A positive alpha indicates\noutperformance, while a negative alpha means underperformance.\nWhy is Option A Correct?\nA fund manager aims to improve alpha to outperform the benchmark (e.g., S&P 500, FTSE\n100).\nIf a fund’s alpha is negative, it has not beaten the benchmark, indicating poor active\nmanagement.\nWhy Not Other Options?\nB (Easier to manage) # A high-alpha strategy often requires active management, which can be\ncomplex.\nC (Improves beta) # Alpha is independent of beta (systematic risk).\nD (Attractive to risk-averse clients) # High alpha does not necessarily mean low risk.\n# Reference: CFA Institute (Alpha & Beta), CISI Wealth & Investment Management.", "zh": "经理为什么希望提高基金 alpha？", "optionsZh": ["基金没有跑赢基准", "更易管理", "alpha 提高会让 beta 提高", "更吸引厌恶风险者"], "explanationZh": "原解析把 alpha 视为相对基准或风险调整后的超额表现，提高它不意味着 beta 必定提高。", "warning": ""}, {"id": 97, "q": "Why would a government’s expansionary fiscal policy lead to a larger budget deficit?", "options": ["Less money is collected in taxes", "Interest rates fall faster than usual", "Private sector spending drops rapidly", "Government spending is funded through borrowing"], "answer": 3, "explanation": "Expansionary fiscal policy involves increased government spending and/or tax cuts to stimulate\neconomic growth.\nWhy is Option D Correct?\nIf the government spends more than it collects in taxes, it must borrow money, increasing the\nbudget deficit.\nGovernments issue bonds to finance the deficit.\nWhy Not Other Options?\nA (Less tax revenue) # While tax cuts may reduce revenue, borrowing is the main reason for a\nbudget deficit.\nB (Falling interest rates) # Interest rates are monetary policy, not fiscal policy.\nC (Drop in private spending) # Expansionary policy aims to increase private spending, not\nreduce it.\n# Reference: UK Office for Budget Responsibility (OBR), CISI Wealth & Investment Management.", "zh": "扩张性财政政策为什么可能扩大预算赤字？", "optionsZh": ["税收减少", "利率降得更快", "私人支出急降", "政府通过借款支出"], "explanationZh": "原解析选择政府借款支持支出；提高支出或减税都可能扩大收支缺口。", "warning": ""}, {"id": 98, "q": "Having prepared recommendations via a report, why would an adviser suggest a face-to-face meeting with their client?", "options": ["In order to collect fees prior to implementation of the recommendations", "To establish the client’s tax position", "So that the client can review the adviser’s qualifications", "To afford the opportunity to clear up any misunderstandings"], "answer": 3, "explanation": "Purpose of Client Meetings: A face-to-face meeting allows the adviser to personally communicate\ncomplex financial recommendations.\nImportance of Clarity: Clients may misunderstand written reports due to technical jargon or\nunfamiliarity with financial terms. This meeting provides an opportunity to ensure clarity and build\ntrust.\nElimination of Other Options:\nA: Collecting fees can be done online or through invoices; this is not the primary purpose of a\nmeeting.\nB: Tax position assessment is typically done before preparing recommendations.\nC: Reviewing adviser qualifications is rare in meetings; trust is built through prior interactions.\nReferences:\nICWIM Module 2: Focus on professional adviser-client relationships and clear communication.", "zh": "提出建议报告后，为何安排面谈？", "optionsZh": ["实施前收费", "确定税务情况", "审核顾问资格", "澄清误解"], "explanationZh": "让客户理解建议并就风险、费用和安排提问。", "warning": ""}, {"id": 99, "q": "Tax relief that can be claimed to prevent overseas profits being taxed twice is known as:", "options": ["Overseas Taxation Relief", "Dividend Taxation Relief", "Double Taxation Relief", "Double Taxation Agreement"], "answer": 2, "explanation": "Double Taxation Relief (DTR) is a mechanism to prevent individuals or companies from paying tax on the\nsame income in two different jurisdictions. This is critical for taxpayers with international earnings or\ninvestments. The relief is typically provided under double taxation agreements (DTAs) between countries.", "zh": "防止海外利润重复征税的减免叫什么？", "optionsZh": ["海外税收减免", "股息税收减免", "双重征税减免", "双重征税协定"], "explanationZh": "减免机制叫 Double Taxation Relief，与协定本身区分。", "warning": ""}, {"id": 100, "q": "Why is the process of prioritising the protection needs of your client important?", "options": ["To establish the net worth of your client", "It provides an opportunity to establish a benchmark", "To protect your firm from risk", "It allows you and the client to agree on an affordable plan"], "answer": 3, "explanation": "The prioritisation of protection needs is crucial in financial planning as it ensures that a client’s financial\nsituation is safeguarded against unforeseen risks, such as illness, death, or loss of income. The \"Know Your\nCustomer\" (KYC) process plays a key role in assessing financial obligations and affordability.\nAffordability & Suitability: The client and adviser must agree on an affordable plan that aligns with\ntheir financial capabilities.\nRisk Mitigation: Protecting against financial risks ensures stability before focusing on wealth\naccumulation.\nRegulatory Requirements: The Financial Conduct Authority (FCA) mandates that advisers ensure\nfinancial plans are affordable and suitable for clients (FCA Handbook).\nIndustry Best Practices: Before recommending investments, advisers prioritise protection through\nlife insurance, income protection, or critical illness cover.\n# Reference: CISI Wealth & Investment Management (Client Protection Strategies), FCA Conduct of\nBusiness Sourcebook (COBS).", "zh": "为什么要确定客户保障需求的优先级？", "optionsZh": ["确定净资产", "建立基准", "保护公司免受风险", "与客户达成负担得起的方案"], "explanationZh": "资源有限，先识别重要风险，再结合预算安排保障。", "warning": ""}, {"id": 101, "q": "If someone in a fiduciary position has personal or professional interests that compete with their duty to act in the client’s best interest, this is called:", "options": ["Discretionary management", "A regulatory breach", "Full disclosure", "A conflict of interest"], "answer": 3, "explanation": "A conflict of interest arises when a financial professional’s own interests compete with their duty to act in\nthe best interest of the client.\n\n\n\nExamples:\nA financial adviser recommending a high-commission product instead of the best investment for\nthe client.\nAn investment manager trading ahead of client orders to profit personally (front-running).\nRegulatory Requirements:\nUnder FCA and MiFID II regulations, firms must disclose conflicts and take reasonable steps\nto manage them.\n# Reference: FCA Handbook (COBS 2.1 - Acting Honestly & Fairly), CISI Ethical Standards.", "zh": "受托人的个人或职业利益与客户最佳利益冲突，叫什么？", "optionsZh": ["全权管理", "监管违规", "完全披露", "利益冲突"], "explanationZh": "利益冲突是利益之间的竞争关系，需识别和管理，并按要求披露。", "warning": ""}, {"id": 102, "q": "An investor deposits £1,000 into an account that pays interest at the rate of 3% per year. If the interest is credited to the account at the end of the year and the investor leaves the money in the account for 5 years, how much money will be in the account at the end of the fifth year?", "options": ["£1,150.00", "£1,157.63", "£1,159.27", "£1,276.28"], "answer": 1, "explanation": "Compound Interest Formula:A=P×(1+r)nA = P \\times (1 + r)^nA=P×(1+r)n\nP: Initial principal (£1,000)\nr: Annual interest rate (3% or 0.03)\nn: Number of years (5)A=1,000×(1+0.03)5A = 1,000 \\times (1 + 0.03)^5A=1,000×(1+0.03)5A=1,\n000×(1.159274)A = 1,000 \\times (1.159274)A=1,000×(1.159274)A=£1,157.63A = £1,157.63A=\n£1,157.63\nElimination of Other Options:\nAll other values result from incorrect application of the formula or ignoring compounding.\nReferences:\nICWIM Module 2: Focus on time value of money and compounding.", "zh": "存入 1,000 英镑，年利率 3%，年末计息，连续放 5 年，最终多少钱？", "optionsZh": ["£1,150.00", "£1,157.63", "£1,159.27", "£1,276.28"], "explanationZh": "原答案为 B，但计算 1000×1.03^5＝1159.27，应对应 C。保留原答案用于忠实呈现，并明确标记冲突。", "warning": "原文件标 B，但 1000×1.03^5＝1159.27，对应 C。与第 76 题答案冲突；面板仍按原文件 B 判分。"}, {"id": 103, "q": "A professional trader was given some price-sensitive, unpublished information in relation to a major grain supplier. As a direct result, they buy futures contracts on grain. Have they committed the offence of insider trading?", "options": ["Yes, regardless of profit or loss", "No, futures on commodities are not defined as securities under insider trading regulations", "Only if they make a profit", "No, provided the futures contract is held to expiry"], "answer": 1, "explanation": "Performance attribution analysis evaluates the performance of a portfolio by breaking it into components\nattributed to specific investment decisions. These include:\nAsset Allocation: The decision on the proportion of the portfolio allocated to different asset classes (e.\ng., stocks, bonds).\nSector Choice: Selecting specific sectors (e.g., technology, healthcare) within asset classes.\nSecurity Selection: Choosing individual securities within the selected sectors.\nRisk analysis, while critical for investment management, is not typically part of standard performance\nattribution frameworks.\nReferences:\nInternational Certificate in Wealth & Investment Management: Portfolio performance evaluation\nsection.\nStandard attribution models: Brinson, Hood, and Beebower model widely used in performance\nattribution.", "zh": "交易员获得谷物供应商未公开的价格敏感信息后买入谷物期货，是否构成内幕交易？", "optionsZh": ["无论盈亏均构成", "商品期货不属于内幕交易规则下的证券，因此不构成", "只有盈利才构成", "持有到期就不构成"], "explanationZh": "原题选 B，但法律结论高度依赖适用制度，不能把此解析当成普遍规则。", "warning": "原解析对商品期货内幕交易作笼统法律结论，未说明适用制度，不能作为通用规则。"}, {"id": 104, "q": "Which index tracking method requires a swap agreement?", "options": ["Full replication", "Stratified Sampling", "Synthetic Replication", "Optimisation"], "answer": 2, "explanation": "Synthetic replication uses derivative contracts (swaps) to track an index without directly holding the\nunderlying assets.\nWhy is Option C Correct?\nThe fund manager enters into a swap agreement with an investment bank.\nThe bank provides the return of the target index, while the fund pays a fixed rate or cash\nreturn.\nThis is common for emerging markets or illiquid assets, where direct replication is difficult.\nWhy Not Other Options?\nA (Full replication) # Buys all index components, no swaps used.\nB (Stratified sampling) # Buys representative index samples, no swaps.\nD (Optimisation) # Uses mathematical models to track an index, no swaps.\n# Reference: CFA Institute (Index Replication Strategies), CISI Wealth & Investment Management.", "zh": "哪种指数跟踪方式需要互换协议？", "optionsZh": ["完全复制", "分层抽样", "合成复制", "优化"], "explanationZh": "合成复制利用互换取得指数收益，而非直接持有所有成分证券。", "warning": ""}, {"id": 105, "q": "How does a negative interest rate policy (NIRP) aim to boost lending?", "options": ["Interest is not charged on loans", "Consumers are paid to borrow money", "By discounting the interest rate charged on loans", "By penalising banks for holding surplus cash"], "answer": 3, "explanation": "A Negative Interest Rate Policy (NIRP) is used by central banks to stimulate economic activity by\npenalising banks for holding excess reserves.\nHow It Works:\n\n\n\nInstead of earning interest, banks pay to keep reserves with the central bank.\nTo avoid losses, banks increase lending to businesses and consumers.\nThis increases money supply, investment, and spending, boosting economic growth.\nReal-World Example: The European Central Bank (ECB) and Bank of Japan implemented NIRP\nto encourage lending.\n# Reference: ECB Negative Interest Rate Policy, CISI Wealth & Investment Management.", "zh": "负利率政策如何刺激放贷？", "optionsZh": ["贷款不收利息", "消费者借钱获报酬", "贷款利率打折", "对银行持有多余现金施加成本"], "explanationZh": "原解析强调银行将多余资金存放央行可能付费，从而提高放贷动机。", "warning": ""}, {"id": 106, "q": "The Arbitrage Pricing Theory (APT) seeks to determine what factors influence security price movements using:", "options": ["Mean variance analysis", "Beta testing", "Technical analysis", "Regression analysis"], "answer": 3, "explanation": "Understanding APT:\nThe Arbitrage Pricing Theory (APT) uses statistical models to identify the factors influencing\nsecurity prices.\nRegression analysis is the primary tool to determine the relationship between security returns and\nmultiple factors, such as inflation, GDP growth, or interest rates.\nElimination of Other Options:\nA: Mean variance analysis pertains to portfolio optimization, not factor analysis.\nB: Beta testing is related to CAPM, not APT.\nC: Technical analysis examines price patterns, not underlying factors.\nReferences:\nICWIM Module 3: Coverage of APT and the role of regression models in security pricing.", "zh": "套利定价理论用什么方法分析证券价格变动因素？", "optionsZh": ["均值方差分析", "贝塔测试", "技术分析", "回归分析"], "explanationZh": "原解析使用多因素回归估计收益对不同风险因子的敏感度。", "warning": ""}, {"id": 107, "q": "Under an accumulation and maintenance trust, when does the trustees' discretion over payments normally cease (if at all)?", "options": ["On the death of the settlor", "On the death of the life tenant", "At the end of a prescribed period", "It continues indefinitely"], "answer": 2, "explanation": "What is an Accumulation and Maintenance Trust?\nThis is a trust designed primarily for minors or young beneficiaries.\nTrustees have discretion over income and capital distributions until a specified event or age,\nafter which the discretion typically ceases.\nWhen Does Discretion Cease?\nGenerally, trustees' discretion ends at the end of a prescribed period or when the beneficiary\nreaches a predetermined age, often 18 or 25.\nThis ensures the trust complies with legal requirements, such as the rule against perpetuities in\nsome jurisdictions.\nICWIM Study Guide, Chapter on Trusts: Details the rules around accumulation and maintenance\ntrusts.\nTrust Law Principles: Highlights limitations of trustee discretion.\nReferences", "zh": "积累与维持信托中，受托人的支付裁量通常何时结束？", "optionsZh": ["设立人死亡", "终身受益人死亡", "规定期间结束", "永久持续"], "explanationZh": "原解析指在约定年龄或规定期限到达后，受益权按信托规则确定。", "warning": ""}, {"id": 108, "q": "Which of the following is a money laundering offence?", "options": ["Avoiding", "Concealing", "Developing", "Producing"], "answer": 1, "explanation": "Money laundering is the process of disguising the origins of illegally obtained money to make it appear\nlegitimate. Concealing assets derived from criminal activities is a criminal offence under anti-money\nlaundering (AML) laws.\nDefinition: \"Concealing\" means hiding or disguising the true nature, location, source, ownership, or\ncontrol of funds derived from criminal activity.\nLegal Framework: The Financial Action Task Force (FATF) and UK Proceeds of Crime Act 2002\n(POCA) classify \"concealing\" as an offence.\nThree Stages of Money Laundering:\nPlacement: Introducing illicit funds into the financial system.\nLayering: Concealing the source via multiple transactions.\nIntegration: Reintroducing \"cleaned\" funds into the economy.\n# Reference: CISI Wealth & Investment Management (AML), FATF Guidelines, UK POCA 2002.", "zh": "哪项属于洗钱行为？", "optionsZh": ["避免", "隐匿", "开发", "生产"], "explanationZh": "隐匿犯罪所得的来源、性质或归属可构成洗钱相关行为。", "warning": ""}, {"id": 109, "q": "A business may need key person protection because:", "options": ["The business relies on the input of an individual", "It is a very small business", "It is to cover a very significant customer", "Its profits are very seasonal"], "answer": 0, "explanation": "Key Person Protection:\nThis insurance protects a business against financial loss if a critical employee (e.g., founder,\nCEO) becomes incapacitated or dies.\nIt is designed to mitigate reliance on essential individuals whose absence would disrupt\noperations.\n\n\n\nElimination of Other Options:\nB: Size of the business is not the determining factor.\nC: Significant customers are protected under other insurance (e.g., credit insurance).\nD: Seasonal profits do not relate to key person risk.\nReferences:\nICWIM Module 5: Focus on business risk management and insurance needs.", "zh": "企业为何可能需要关键人物保障？", "optionsZh": ["依赖某个人的重要贡献", "企业很小", "保障重要客户", "利润季节性很强"], "explanationZh": "关键人物缺位可能损害收入或经营，保障用于补偿相关经济损失。", "warning": ""}, {"id": 110, "q": "Which type of investment is associated with providing finance to growing companies with the objective of exiting via a profitable stock market listing?", "options": ["Convertible bonds", "Preference shares", "Private equity", "Structured products"], "answer": 2, "explanation": "Private Equity and Growing Companies:\nPrivate equity involves investing in privately-held companies with the goal of increasing their\nvalue and exiting through a stock market listing (IPO) or sale.\nThis investment type targets growth-stage businesses requiring significant capital.\nElimination of Other Options:\nA: Convertible bonds are debt instruments, not equity investments.\nB: Preference shares provide fixed dividends and are not growth-oriented investments.\nD: Structured products are financial instruments tied to underlying assets and not specific to\ngrowth financing.\nReferences:\nICWIM Module 3: Coverage of private equity investments and their objectives.", "zh": "为成长企业融资并期待通过盈利上市退出，属于哪类投资？", "optionsZh": ["可转债", "优先股", "私募股权", "结构性产品"], "explanationZh": "私募股权投资非上市企业，上市是可能的退出渠道之一。", "warning": ""}, {"id": 111, "q": "A rise in living standards will tend to:", "options": ["Reduce the demand for commodities", "Have no effect on commodities", "Increase government participation in the commodities markets", "Create an increased demand for commodities"], "answer": 3, "explanation": "Understanding the Question Context:The question examines the relationship between rising living\nstandards and commodity demand. Commodities refer to basic goods used in commerce that are\ninterchangeable with others of the same type, such as agricultural products (wheat, coffee), energy\nproducts (oil, gas), and metals (gold, copper).\nImpact of Rising Living Standards:\nEconomic Theory: As living standards improve, disposable incomes generally increase, allowing\nindividuals to purchase more goods and services.\nConsumption Patterns: Higher living standards drive demand for:\nEnergy commodities: Increased vehicle ownership and industrial activity raise the demand\nfor oil, gas, and electricity.\nAgricultural commodities: Rising incomes lead to greater consumption of diverse and\nhigher-quality food, including meat and grains (used for feed).\nIndustrial and precious metals: Construction, technology, and luxury markets grow with\nincreased disposable income, driving demand for metals like steel, copper, and gold.\nExplanation of the Correct Option (D):\nIncreased Demand: A direct relationship exists between rising living standards and commodity\ndemand, as seen in both developed and developing economies.\nHistorical Context: Economic growth in emerging markets (e.g., China, India) has shown a clear\ncorrelation between rising GDP per capita and increased commodity consumption.\nRejection of Incorrect Options:\nA (Reduce the demand for commodities): This contradicts economic principles; higher living\nstandards typically boost demand for goods and services, including commodities.\n\n\n\nB (Have no effect on commodities): Evidence shows a significant impact on commodities,\nmaking this incorrect.\nC (Increase government participation in the commodities markets): While governments may\nengage in commodity markets for regulatory or strategic purposes, this is not a direct\nconsequence of rising living standards.\nReferences from the International Certificate in Wealth & Investment Management:\nModule 1: Macroeconomic Environment: Emphasizes the correlation between economic growth and\ndemand for natural resources and commodities.\nModule 3: Investment Assets and Markets: Discusses the role of commodities as essential assets\nwhose demand rises with economic development and improved living standards.\nModule 6: Trends in Emerging Markets: Demonstrates the increase in commodity demand with\neconomic progression in developing economies.", "zh": "生活水平提高通常会怎样影响商品需求？", "optionsZh": ["减少需求", "没有影响", "政府参与增加", "增加需求"], "explanationZh": "原解析认为生活消费和生产需求增长，会增加对能源、材料等商品的需求。", "warning": ""}, {"id": 112, "q": "Personal accident policies will pay out:", "options": ["Once the insured has been seen by a doctor", "On the day of the accident", "Following a waiting period", "Once the insurance company has received the medical documentation"], "answer": 2, "explanation": "Personal Accident Policies:\nThese policies often include a waiting period before payouts, allowing insurers to verify claims\nand ensure eligibility.\nThe waiting period varies depending on the policy terms.\nElimination of Other Options:\nA: A doctor's visit is often necessary but not sufficient for payout.\nB: Payments are not instantaneous.\nD: Documentation is required, but it is part of the claim process, not the trigger for payout.\n\n\n\nReferences:\nICWIM Module 5: Details on insurance policy structures and claims processes.\nPersonal Accident Policies:\nThese policies often include a waiting period before payouts, allowing insurers to verify claims\nand ensure eligibility.\nThe waiting period varies depending on the policy terms.\nElimination of Other Options:\nA: A doctor's visit is often necessary but not sufficient for payout.\nB: Payments are not instantaneous.\nD: Documentation is required, but it is part of the claim process, not the trigger for payout.\nReferences:\nICWIM Module 5: Details on insurance policy structures and claims processes.", "zh": "个人意外险通常何时赔付？", "optionsZh": ["医生看诊后", "事故当天", "等待期后", "保险公司收到医疗材料后"], "explanationZh": "原题选等待期后；具体保障、等待期及理赔条件应以合同为准。", "warning": ""}, {"id": 113, "q": "If the holder of a long futures contract sells it ahead of expiry, they are considered to have:", "options": ["Exercised their position", "Closed out their position", "Taken delivery of the underlying", "Delivered the underlying"], "answer": 1, "explanation": "Long Futures Contract Defined\nA long futures contract represents a commitment to buy an underlying asset at a set price on a\nfuture date.\nClosing Out the Position\nIf the holder sells the contract before expiry, they are said to close out the position, effectively\nnegating their obligation to take delivery of the underlying asset.\n\n\n\nWhy the Answer is B\nSelling ahead of expiry removes the obligation, hence closing the position.\nWhy Other Options are Incorrect\nA. Exercised: Applies to options, not futures.\nC. Taken delivery: Happens only if the contract is held to maturity.\nD. Delivered: Applies to the short position, not the long holder.\nICWIM Study Guide, Chapter on Derivatives: Explains closing out futures contracts.\nFutures Market Principles: Discusses position management in futures trading.\nReferences", "zh": "期货多头在到期前卖出相应合约，叫什么？", "optionsZh": ["行权", "平仓", "接收标的", "交付标的"], "explanationZh": "通过反向交易抵消原多头头寸，称为平仓。", "warning": ""}, {"id": 114, "q": "What is the role of a central counterparty (CCP)?", "options": ["The CCP guarantees that the counterparties will not default", "It interposes itself between the counterparties to a trade, becoming the buyer to every seller and the seller to every buyer", "To act as a market maker between counterparties", "To provide funding to counterparties as and when required"], "answer": 1, "explanation": "Role of a Central Counterparty (CCP):\nA CCP acts as a mediator in financial transactions, ensuring stability and reducing counterparty\nrisk.\nBy becoming the buyer to every seller and the seller to every buyer, the CCP ensures that trades\nare completed even if one party defaults.\nElimination of Other Options:\nA: CCP does not guarantee no default but mitigates its impact.\nC: Market making involves liquidity provision, not CCP's role.\n\n\n\nD: CCP does not provide funding but manages trade clearing.\nReferences:\nICWIM Module 5: Explanation of trade clearing mechanisms and the CCP’s role.", "zh": "中央对手方（CCP）的作用是什么？", "optionsZh": ["保证交易方绝不违约", "介入交易，成为每个卖方的买方及每个买方的卖方", "担任做市商", "按需融资"], "explanationZh": "CCP 通过介入交易集中管理对手方风险，但不意味着风险完全消失。", "warning": ""}, {"id": 115, "q": "When creating a portfolio for a risk-averse client, why would you select stocks with a beta of less than one?", "options": ["So that the portfolio is easier to understand", "So that the portfolio moves in line with the market", "In order to produce a low-volatility portfolio", "To produce a high-volatility portfolio"], "answer": 2, "explanation": "Stocks with a beta of less than one are less volatile than the overall market. Including such stocks in a\nportfolio helps reduce its overall volatility, aligning with the risk-averse nature of the client.\nEasier to understand (A): Simplicity is not a factor in beta selection.\nMoves in line with the market (B): A beta of less than one means the portfolio moves less than the\nmarket.\nHigh-volatility portfolio (D): This would involve stocks with a beta greater than one, contrary to the\nclient’s risk profile.\nReferences:\nInternational Certificate in Wealth & Investment Management: Beta as a measure of systematic risk and\nits implications for portfolio construction.\nCAPM (Capital Asset Pricing Model) principles on beta and risk.", "zh": "为厌恶风险客户建组合，为何选择 beta 小于 1 的股票？", "optionsZh": ["更容易理解", "与市场完全同步", "构建较低波动组合", "构建高波动组合"], "explanationZh": "原解析指较低 beta 代表对市场变动较不敏感；beta 与总波动并非同一概念。", "warning": ""}, {"id": 116, "q": "When analysing rates of return, why is a short-dated government bond considered to be the risk-free rate?", "options": ["Governments are considered unlikely to default", "Investors can buy short-dated government bonds without risk", "Government bonds are free from all types of risk", "There is no tracking error when measuring the performance of government bonds"], "answer": 0, "explanation": "Risk-Free Rate\nThe rate of return on an investment with virtually no risk of financial loss.\nShort-dated government bonds are considered risk-free because governments, especially in\ndeveloped economies, are deemed highly unlikely to default.\nWhy the Answer is A\nShort-dated bonds minimize risks associated with duration (interest rate risk).\nGovernments can typically print money or increase taxes to meet debt obligations, reducing\ndefault risk.\nWhy Other Options are Incorrect\nB. Without risk: Investors still face inflation risk and currency risk.\nC. Free from all risks: No investment is completely risk-free; risk is minimized, not eliminated.\nD. No tracking error: Irrelevant to the definition of a risk-free rate.\nICWIM Study Guide, Chapter on Risk Management: Defines the risk-free rate and its attributes.\nEconomic Theory: Short-dated government bonds as benchmarks for risk-free rates.\nReferencesThus, the correct answer is A. Governments are considered unlikely to default.", "zh": "分析回报时，为何用短期政府债券代表无风险利率？", "optionsZh": ["政府通常被认为不太可能违约", "投资者购买它完全无风险", "免除所有风险", "没有跟踪误差"], "explanationZh": "原解析强调较低信用风险与较短期限，是估算基准，不代表所有政府债都绝对安全。", "warning": ""}, {"id": 117, "q": "Which of these banks are likely to have relatively few legacy issues?", "options": ["Central bank", "Challenger bank", "Online bank", "Retail bank"], "answer": 1, "explanation": "Challenger banks are newer, digital-first institutions that operate with modern technology, avoiding the\nlegacy issues that traditional banks face.\nWhy is Option B Correct?\nThey lack outdated IT systems that traditional banks struggle to upgrade.\nThey focus on digital banking services, reducing operational inefficiencies.\nExamples: Monzo, Starling Bank, Revolut.\nWhy Not Other Options?\nA (Central bank) # Not a commercial bank; deals with monetary policy, not retail banking\ninfrastructure.\nC (Online bank) # Some online banks are part of traditional banks, inheriting legacy issues.\nD (Retail bank) # Large banks have aging IT systems, regulatory burdens, and high costs.\n# Reference: UK Financial Conduct Authority (FCA) - Challenger Banks Report, CISI Wealth & Investment\nManagement.", "zh": "哪类银行通常较少受到历史系统问题影响？", "optionsZh": ["中央银行", "挑战者银行", "网上银行", "零售银行"], "explanationZh": "新设挑战者银行通常较少承担老旧系统和历史流程包袱。", "warning": ""}, {"id": 118, "q": "Which term is used to describe a dividend payment made by a company with insufficient earnings to do so?", "options": ["An ex-dividend payment", "A proxy dividend payment", "A scrip dividend payment", "An uncovered dividend payment"], "answer": 3, "explanation": "What is an Uncovered Dividend?\nAn uncovered dividend payment occurs when a company pays a dividend despite having\ninsufficient earnings to support the payout.\nThe dividend is effectively \"uncovered\" by profits, meaning the company might be using\nreserves, taking on debt, or liquidating assets to fund the dividend.\n\n\n\nWhy Companies Pay Uncovered Dividends\nTo maintain investor confidence and avoid negative signals to the market.\nInvestors may interpret a dividend cut as a sign of financial trouble, so companies sometimes\nprioritize dividends even at a financial strain.\nOther Options Explained\nA. Ex-dividend payment: Refers to the status of a stock when a dividend has already been\ndeclared, and new buyers are not entitled to the dividend.\nB. Proxy dividend payment: No such widely recognized term in this context.\nC. Scrip dividend payment: A dividend paid in the form of additional shares rather than cash.\nExample\nA company reports $500,000 in profits but declares a $1,000,000 dividend, funding the shortfall\nthrough borrowing. This is an uncovered dividend.\nICWIM Textbook, Chapter on Corporate Actions: Discusses uncovered dividends and their\nimplications.\nCorporate Finance Standards: Defines uncovered dividends and contrasts them with scrip and ex-\ndividends.\nReferences", "zh": "盈利不足以覆盖的股息叫什么？", "optionsZh": ["除息股息", "代理股息", "以股代息", "未获盈利覆盖的股息"], "explanationZh": "Uncovered dividend 指盈利不足以覆盖股息支付。", "warning": ""}, {"id": 119, "q": "Which of the following will be a major constraint on a client’s ability to invest and protect against all of the risks that might arise?", "options": ["Age", "Affordability", "Risk aversion", "Tax implications"], "answer": 1, "explanation": "Why Affordability is the Major Constraint\nA client’s ability to mitigate risks is directly limited by their financial resources.\n\n\n\nEven the most sophisticated risk strategies, such as diversification, derivatives, or insurance,\nrequire financial capacity.\nOther Options Analyzed\nAge: Impacts risk tolerance but does not constrain the financial ability to manage risks.\nRisk aversion: A behavioral factor, not a financial constraint.\nTax implications: Important but secondary compared to affordability.\nICWIM Textbook, Chapter on Investment Constraints: Highlights affordability as the top financial\nconstraint.\nWealth Planning Principles: Discusses practical limitations of risk mitigation strategies.\nReferencesThus, the answer is B. Affordability.", "zh": "限制客户投资并为各种风险购买保障的主要因素是什么？", "optionsZh": ["年龄", "负担能力", "风险厌恶", "税务影响"], "explanationZh": "预算和可支配资源限制可投资金额及可购买保障。", "warning": ""}, {"id": 120, "q": "Why might a portfolio manager use an equity fund rather than direct equity investment within a portfolio?", "options": ["To avoid paying capital gains tax", "To gain exposure to a specialist sector", "In order to reduce ongoing charges", "To benefit from changes in volatility"], "answer": 1, "explanation": "Equity funds allow portfolio managers to efficiently access a specific market or sector that may otherwise\nrequire significant resources and expertise to invest in directly. For instance, a fund specializing in renewable\nenergy provides exposure to that sector without the need for individual stock selection.\nAvoiding capital gains tax (A): This is not applicable because funds do not inherently avoid tax\nobligations.\nReducing ongoing charges (C): Funds typically have higher fees than directly holding equities.\nChanges in volatility (D): While funds manage diversification, they do not specifically capitalize on\nvolatility.\nReferences:\n\n\n\nInternational Certificate in Wealth & Investment Management: Section on mutual funds and specialized\ninvestment funds.\nUse of funds for sectoral or thematic investment strategies.", "zh": "为何用股票基金代替直接买股票？", "optionsZh": ["避免资本利得税", "获得特定专业行业敞口", "减少持续收费", "从波动变化获益"], "explanationZh": "专业行业基金可提供研究能力与行业分散机会，不保证收费更低或免税。", "warning": ""}, {"id": 121, "q": "Establishing sufficient details about a client in order to give advice is known as:", "options": ["Assessing suitability and affordability", "Determining attitude to risk", "Giving information on status disclosure", "Following know your customer procedures"], "answer": 3, "explanation": "Know Your Customer (KYC)\nA regulatory process requiring firms to collect sufficient information about a client to ensure\nadvice is appropriate.\nIt involves understanding the client’s financial situation, goals, and risk tolerance.\nWhy the Answer is D\nEstablishing sufficient client details is the essence of KYC. It ensures compliance with\nregulations and prevents mis-selling.\nWhy Other Options are Incorrect\nA. Suitability and affordability: Part of KYC but does not encompass all aspects.\nB. Attitude to risk: A component of KYC but not the full procedure.\nC. Status disclosure: Refers to informing the client about the advisor’s regulatory status, not\nclient profiling.\nICWIM Study Guide, Chapter on Regulatory Compliance: Details KYC as a cornerstone of financial\nadvice.\nFCA Guidelines: KYC is a mandatory process in the UK’s financial services.\n\n\n\nReferencesThus, the correct answer is D. Following know your customer procedures.", "zh": "为提供建议充分了解客户，叫什么？", "optionsZh": ["评估适当性与负担能力", "确定风险态度", "身份披露", "履行了解客户程序"], "explanationZh": "KYC 包括了解客户财务状况、目标、知识经验和风险情况。", "warning": ""}, {"id": 122, "q": "Once an offshore foundation is established, who will normally be responsible for making ongoing decisions regarding the operational use of the foundation’s assets?", "options": ["The board of directors", "The trustees", "The council", "The beneficiaries"], "answer": 2, "explanation": "# Reference: Offshore Financial Centres (OFCs), CISI Wealth & Investment Management.", "zh": "离岸基金会成立后，谁通常决定其资产的日常运用？", "optionsZh": ["董事会", "受托人", "理事会", "受益人"], "explanationZh": "原解析将基金会治理机构称为 council，即理事会；与信托受托人区分。", "warning": ""}, {"id": 123, "q": "In what circumstances would a central bank use its foreign reserves in the currency markets?", "options": ["To lower the rate of inflation", "To control the money supply", "To influence the nation's currency", "When influencing the short-term interest rate"], "answer": 2, "explanation": "Central Bank Actions with Foreign Reserves\nCentral banks use foreign reserves to intervene in currency markets to stabilize or influence their\nnation’s currency exchange rate.\nThis can involve buying or selling foreign currencies.\nWhy the Answer is C\nCurrency interventions aim to manage exchange rate volatility, maintain competitiveness, or\nstabilize the currency during economic shocks.\n\n\n\nWhy Other Options are Incorrect\nA. Inflation: Not directly controlled through currency market interventions.\nB. Money supply: Managed through monetary policy tools like open market operations.\nD. Short-term interest rates: Controlled through domestic monetary policy, not foreign reserves.\nICWIM Study Guide, Chapter on Monetary Policy: Explains the use of foreign reserves for currency\nstabilization.\nCentral Banking Principles: Discusses currency interventions.\nReferencesThus, the correct answer is C. To influence the nation's currency.", "zh": "央行何时会动用外汇储备参与汇市？", "optionsZh": ["降低通胀", "控制货币供应", "影响本国汇率", "影响短期利率"], "explanationZh": "买卖外汇储备可影响本币汇率。", "warning": ""}, {"id": 124, "q": "According to Modern Portfolio Theory (MPT), portfolios below the efficient frontier are not efficient because:", "options": ["They attract additional charges", "Risk-free assets are not profitable", "The investor assumes proportionately higher risk for lower incremental returns", "A greater return could be achieved for the same risk"], "answer": 3, "explanation": "Modern Portfolio Theory (MPT) and the Efficient Frontier\nThe efficient frontier represents portfolios that offer the highest return for a given level of risk.\nPortfolios below the frontier are inefficient because they provide lower returns for the same\nlevel of risk or higher risk for the same level of return.\nWhy the Answer is D\nPortfolios below the efficient frontier are suboptimal; the investor is not maximizing return\nrelative to the risk taken.\nICWIM Study Guide, Chapter on Portfolio Theory: Discusses the efficient frontier and inefficiency of\nsuboptimal portfolios.\nMPT Literature: Explains risk-return optimization.\nReferences", "zh": "现代投资组合理论为何认为有效前沿下方组合无效率？", "optionsZh": ["额外收费", "无风险资产不盈利", "更高风险只换较低增量回报", "同等风险可取得更高回报"], "explanationZh": "有效前沿表示给定风险下的最高预期回报；其下方存在更优组合。", "warning": ""}, {"id": 125, "q": "Negotiable bearer securities issued by commercial banks in exchange for fixed-term deposits are known as:", "options": ["Treasury Bills", "Commercial Paper", "Bills of Exchange", "Certificates of Deposit"], "answer": 3, "explanation": "A Certificate of Deposit (CD) is a negotiable bearer security issued by banks, representing a fixed-term\ndeposit with a specified interest rate.\nKey Features of CDs:\nIssued by commercial banks.\nFixed-term investment (e.g., 3 months to 1 year).\nCan be traded in secondary markets, making them a liquid investment.\nWhy Not Other Options?\nA (Treasury Bills) # Issued by governments, not banks.\nB (Commercial Paper) # Issued by corporations, not banks.\nC (Bills of Exchange) # Used for trade finance, not fixed-term deposits.\n# Reference: Bank of England (Certificates of Deposit), CISI Wealth & Investment Management.", "zh": "商业银行为定期存款发行的可转让不记名证券叫什么？", "optionsZh": ["国库券", "商业票据", "汇票", "存款证"], "explanationZh": "存款证（CD）是银行发行、可交易的存款工具。", "warning": ""}, {"id": 126, "q": "A market which employs an electronic order book to match buyers with sellers in strict order by price is known as:", "options": ["Order-driven", "Quote-driven", "On-exchange", "Over-the-counter"], "answer": 0, "explanation": "In an order-driven market, an electronic order book is used to match buy and sell orders based on strict price\nand time priority. This system ensures transparency and fair pricing since all orders are visible to market\nparticipants.", "zh": "电子订单簿按价格优先撮合的市场叫什么？", "optionsZh": ["订单驱动", "报价驱动", "场内", "场外"], "explanationZh": "订单驱动通过买卖盘撮合，不依赖做市商提供双边报价。", "warning": ""}, {"id": 127, "q": "The ongoing charges figure for a mutual fund should be included in its:", "options": ["Key features document", "Key investor information document", "Prospectus", "Terms of business"], "answer": 1, "explanation": "The ongoing charges figure (OCF) of a mutual fund is included in its Key Investor Information Document\n(KIID). The KIID provides standardized and essential information about a fund’s costs, risks, and\nperformance, ensuring transparency for investors.", "zh": "共同基金持续费用指标应列在哪份文件中？", "optionsZh": ["主要特点文件", "关键投资者信息文件", "招募说明书", "业务条款"], "explanationZh": "原题选择 KIID，采用该题库对应的基金信息披露框架。", "warning": ""}, {"id": 128, "q": "Which of the following is used to establish an investor's total return from a bond?", "options": ["Running yield", "Annual coupon", "Price-to-book ratio", "Yield to maturity"], "answer": 3, "explanation": "Yield to Maturity (YTM)\nYTM is the total return an investor can expect from a bond if held to maturity, considering\nannual coupon payments and any difference between the purchase price and the bond's face\nvalue.\n\n\n\nWhy the Answer is D\nYTM incorporates all cash flows, providing a comprehensive measure of total return.\nWhy Other Options are Incorrect\nA. Running Yield: Considers only current income relative to price, not total return.\nB. Annual Coupon: Ignores price changes and reinvestment potential.\nC. Price-to-Book Ratio: Unrelated to bonds, applies to equities.\nICWIM Study Guide, Chapter on Fixed Income: Details YTM and its role in total return calculations.\nBond Investment Literature: Highlights the comprehensive nature of YTM.\nReferences", "zh": "哪项指标衡量债券持有到期的整体收益？", "optionsZh": ["当期收益率", "年票息", "市净率", "到期收益率"], "explanationZh": "到期收益率考虑票息、买入价格和到期偿还价值，依赖相应计算假设。", "warning": ""}, {"id": 129, "q": "An advisor is reviewing a client's portfolio which has a time horizon of 15 years and is made up primarily of bonds and cash but with some exposure to equities and other higher-risk investments. It is reasonable to believe that the client's risk appetite is:", "options": ["Low Risk", "Low-Mid Risk", "Mid Risk", "Mid-High Risk"], "answer": 1, "explanation": "Risk Appetite and Portfolio Composition\nA portfolio primarily of bonds and cash indicates a conservative approach, but the inclusion of\nequities and higher-risk investments suggests some tolerance for risk.\nA 15-year time horizon allows for a balanced approach, mitigating risks associated with equities\nover time.\nWhy the Answer is B\nThe mix of low-risk (bonds, cash) and some high-risk exposure (equities) aligns with Low-Mid\nRisk.\n\n\n\nWhy Other Options are Incorrect\nA. Low Risk: Overlooks the equity and higher-risk components.\nC. Mid Risk / D. Mid-High Risk: Overestimate the risk level due to the dominance of bonds and\ncash.\nICWIM Study Guide, Chapter on Risk Profiling: Explains portfolio risk classification.\nReferences", "zh": "客户投资期 15 年，主要持债券和现金，少量股票等高风险资产，风险偏好可能是什么？", "optionsZh": ["低", "中低", "中", "中高"], "explanationZh": "原解析依据偏保守的资产结构选择中低风险；实际风险评估不能只看现有持仓。", "warning": ""}, {"id": 130, "q": "What term is used to describe a situation where clients give investment instructions to a firm without being given advice to do so?", "options": ["Discretionary", "Execution only", "Non-discretionary", "Robo-advice"], "answer": 1, "explanation": "Execution-only refers to situations where clients make investment decisions without receiving advice from the\nfirm. The firm’s role is limited to executing the client’s instructions, without providing recommendations or\nassessing suitability.\nKey features:\nThe firm does not offer advice.\nThe client takes full responsibility for their investment decisions.", "zh": "客户未获建议，直接向公司发出投资指令，叫什么？", "optionsZh": ["全权管理", "仅执行", "非全权管理", "智能投顾"], "explanationZh": "Execution-only 仅按指令执行，未针对交易提供建议。", "warning": ""}, {"id": 131, "q": "Which of the following is categorised as a soft commodity?", "options": ["Copper", "Oil", "Lumber", "Natural gas"], "answer": 2, "explanation": "Performance attribution analysis evaluates the performance of a portfolio by breaking it into components\nattributed to specific investment decisions. These include:\nAsset Allocation: The decision on the proportion of the portfolio allocated to different asset classes (e.\ng., stocks, bonds).\nSector Choice: Selecting specific sectors (e.g., technology, healthcare) within asset classes.\nSecurity Selection: Choosing individual securities within the selected sectors.\nRisk analysis, while critical for investment management, is not typically part of standard performance\nattribution frameworks.\nReferences:\nInternational Certificate in Wealth & Investment Management: Portfolio performance evaluation\nsection.\nStandard attribution models: Brinson, Hood, and Beebower model widely used in performance\nattribution.", "zh": "哪项属于软商品？", "optionsZh": ["铜", "石油", "木材", "天然气"], "explanationZh": "原题在所给选项中选择木材，与金属和能源商品区分。", "warning": ""}, {"id": 132, "q": "Standard deviation is used when analysing portfolios because it:", "options": ["Allows for a comparison of volatility", "Identifies profitable trades", "Makes it easier to track the performance against a benchmark", "Identifies underperforming assets"], "answer": 0, "explanation": "Standard deviation measures the volatility of returns, helping investors compare the risk levels of different\nportfolios or assets. A higher standard deviation indicates greater uncertainty in returns, which can signify\nhigher risk.", "zh": "分析组合时为何使用标准差？", "optionsZh": ["比较波动性", "识别盈利交易", "更易跟踪相对基准表现", "识别落后资产"], "explanationZh": "标准差衡量回报离散程度，可用于比较历史波动。", "warning": ""}, {"id": 133, "q": "When an investment manager manages and makes changes to a portfolio without referring to the client, this is known as:", "options": ["Execution-only", "Advisory dealing", "Discretionary", "Financial planning"], "answer": 2, "explanation": "A discretionary investment manager has full authority to buy and sell investments without seeking client\napproval for each transaction.\nWhy is Option C Correct?\nThe manager follows a pre-agreed investment mandate that aligns with the client’s objectives\nand risk profile.\nCommon in wealth management and private banking.\nWhy Not Other Options?\nA (Execution-only) # The firm executes trades but does not provide investment advice or\nmanagement.\nB (Advisory dealing) # The manager provides advice, but the client makes the final decision.\nD (Financial planning) # Financial planning involves long-term wealth strategies, not active\nportfolio management.\n# Reference: FCA Conduct of Business Rules (COBS 9 - Discretionary Management), CISI Wealth &\nInvestment Management.", "zh": "经理不逐次征求客户意见，自行管理和调整组合，叫什么？", "optionsZh": ["仅执行", "顾问式交易", "全权委托", "财务规划"], "explanationZh": "Discretionary 指客户在约定授权范围内把决策权交给经理。", "warning": ""}, {"id": 134, "q": "A non-profit, whole-of-life assurance policy will pay:", "options": ["A return, linked to the insurance company's units", "A fixed sum, provided death occurs within a
