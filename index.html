 pre-determined time", "An amount linked to the prevailing rate of inflation", "A fixed sum chosen at the outset"], "answer": 3, "explanation": "A non-profit whole-of-life assurance policy is a type of life insurance that guarantees a fixed payout upon\ndeath, without any investment element.\nWhy is Option D Correct?\nThe sum assured is determined at the start of the policy and does not fluctuate.\nUnlike unit-linked or with-profits policies, the payout is fixed and guaranteed.\nWhy Not Other Options?\nA (Linked to insurance company’s units) # Only applies to unit-linked policies, which have\ninvestment risk.\nB (Pre-determined time limit) # Describes term life insurance, not whole-of-life.\nC (Inflation-linked payout) # Applies to index-linked policies, not non-profit whole-of-life.\n# Reference: FCA Handbook (Insurance Conduct of Business), CISI Wealth & Investment Management.", "zh": "无分红终身寿险会支付什么？", "optionsZh": ["与基金单位相关的回报", "限定期间死亡才付固定金额", "与通胀相关金额", "投保时选定的固定金额"], "explanationZh": "原解析指不参与分红的终身寿险按合同约定固定保额赔付，与定期寿险区分。", "warning": ""}, {"id": 135, "q": "A bullet bond portfolio can have an advantage over a barbell bond portfolio because:", "options": ["It is always riding the yield curve", "It only invests in short-dated bonds", "The gross redemption yield is always higher", "A bullet portfolio does not require regular rebalancing"], "answer": 3, "explanation": "Bullet Bond Portfolio\nInvests in bonds with maturities focused on a single date or time period (a \"bullet\").\nThis structure eliminates the need for frequent adjustments as maturities naturally align with\nportfolio objectives.\nBarbell Bond Portfolio\nInvests in bonds with very short and very long maturities.\n\n\n\nRequires regular rebalancing to maintain the intended allocation, increasing transaction costs.\nWhy the Answer is D\nA bullet portfolio simplifies management by focusing on a single maturity period, avoiding the\ncomplexity of rebalancing inherent in barbell strategies.\nICWIM Study Guide, Chapter on Fixed-Income Strategies: Compares bullet and barbell portfolios.\nBond Portfolio Management Principles: Highlights the operational advantages of bullet structures.\nReferences", "zh": "子弹式债券组合相对杠铃式组合的优势可能是什么？", "optionsZh": ["总能沿曲线滚降", "仅买短期债券", "到期收益率总更高", "无需经常再平衡"], "explanationZh": "原解析认为到期日集中可减少维持两端期限结构的再平衡需求；不代表完全无需管理。", "warning": ""}, {"id": 136, "q": "According to economic theory, firms maximize profit by:", "options": ["Creating economies of scale", "Balancing short-run costs against increasing and diminishing returns", "Reaching minimum efficient scale (MES)", "Equating marginal revenue (MR) to marginal cost (MC)"], "answer": 3, "explanation": "# Reference: Microeconomic Theory (Profit Maximization), CISI Wealth & Investment Management.", "zh": "经济理论中，企业怎样实现利润最大化？", "optionsZh": ["创造规模经济", "平衡短期成本与报酬变化", "达到最小有效规模", "使边际收益等于边际成本"], "explanationZh": "在相应模型条件下，最优产量对应 MR＝MC，并需满足适当的最优性条件。", "warning": ""}, {"id": 137, "q": "An investor would regard a company's Interest Cover ratio as significant because it provides:", "options": ["An indication of the extent to which the company can service its debts", "An indication of what interest rate the company is paying", "A breakdown of how much debt a company has in relation to equity", "A summary of how much liquid cash an organisation has for funding dividend payments"], "answer": 0, "explanation": "Interest Cover Ratio measures how easily a company can meet interest payments on its debt.\n\n\n\nA black text with black letters AI-generated content may be incorrect.\nWhy is Option A Correct?\nA higher ratio means a company comfortably covers interest costs.\nA low ratio signals higher financial risk and potential default risk.\nWhy Not Other Options?\nB (Interest rate paid) # The ratio assesses coverage, not cost of debt.\nC (Debt vs equity breakdown) # This is measured by the debt-to-equity ratio.\nD (Cash for dividends) # Interest cover assesses debt serviceability, not dividend affordability\n.\n# Reference: CFA Institute (Financial Ratios), CISI Wealth & Investment Management.\n[Original contains a formula image. Refer to the source PDF for that image.]", "zh": "利息保障倍数为何重要？", "optionsZh": ["衡量债务付息能力", "显示借款利率", "显示债务权益比", "显示派息现金"], "explanationZh": "息税前利润÷利息费用，用于衡量盈利对利息支付的覆盖。", "warning": ""}, {"id": 138, "q": "Why would an investment manager conduct forward-looking security attribution?", "options": ["In order to calculate future profits", "To establish where future risks lie", "To quantify next year's annual charge", "In order to establish by how much they need to outperform the benchmark"], "answer": 1, "explanation": "Forward-looking security attribution focuses on identifying potential future risks in a portfolio by\nanalyzing market trends, economic indicators, and security performance forecasts.\nWhy is Option B Correct?\nInvestment managers use quantitative models and stress testing to identify upcoming risks.\nHelps in adjusting asset allocation and implementing hedging strategies.\nWhy Not Other Options?\n\n\n\nA (Calculate future profits) # Attribution focuses on performance breakdown, not profit\nforecasting.\nC (Quantify annual charge) # Fees are predetermined and not part of attribution analysis.\nD (Outperform benchmark) # Attribution measures risk sources, not outperformance targets.\n# Reference: CFA Institute (Performance Attribution), CISI Wealth & Investment Management.", "zh": "为何做前瞻性证券归因分析？", "optionsZh": ["计算未来利润", "识别未来风险位置", "计算明年管理费", "确定必须超越基准多少"], "explanationZh": "原解析将前瞻分析用于识别潜在风险来源，而非保证预测利润。", "warning": ""}, {"id": 139, "q": "A fiduciary relationship normally arises between:", "options": ["A husband and his wife", "A lawyer and his client", "A company and its suppliers", "A head of state and its government"], "answer": 1, "explanation": "A fiduciary relationship arises when one party is legally obligated to act in the best interest of another. This\nrelationship is characterized by trust and confidence. A classic example is the relationship between a lawyer\nand their client, where the lawyer must prioritize the client’s interests above their own.\nHusband and wife (A): This is generally not a fiduciary relationship but rather a personal relationship.\nCompany and suppliers (C): This is a contractual, not fiduciary, relationship.\nHead of state and government (D): This is a political or constitutional relationship, not fiduciary.\nReferences:\nInternational Certificate in Wealth & Investment Management: Fiduciary duties and examples.\nLegal definitions of fiduciary relationships in professional settings.", "zh": "哪两者通常形成受托关系？", "optionsZh": ["夫妻", "律师与客户", "公司与供应商", "国家元首与政府"], "explanationZh": "原题以律师与客户为典型受托关系。", "warning": ""}, {"id": 140, "q": "Why might an expansionary fiscal policy lead to future inflationary pressures?", "options": ["It causes higher interest rates", "Workers demanding higher wages", "Due to a significant fall in private sector investment", "Due to the effect of time lag"], "answer": 1, "explanation": "Expansionary Fiscal Policy and Inflation:\nExpansionary fiscal policy increases aggregate demand by boosting public spending or reducing\ntaxes.\nThis raises employment, leading to higher wage demands as workers negotiate for their share of\neconomic growth.\nHigher wages increase production costs, causing inflationary pressures.\nElimination of Other Options:\nA: Higher interest rates are associated with contractionary, not expansionary, policy.\nC: Private sector investment typically rises, not falls.\nD: Time lag affects the policy's impact but is not a direct cause of inflation.\nReferences:\nICWIM Module 1: Discussion on fiscal policy and its effects on inflation.", "zh": "扩张性财政政策为何可能造成未来通胀压力？", "optionsZh": ["利率更高", "工人要求更高工资", "私人投资大幅下降", "时间滞后效应"], "explanationZh": "原题选择工资需求上升，解析从需求扩张、劳动力需求和工资成本传导解释。", "warning": ""}, {"id": 141, "q": "Which currency is most heavily traded on international markets?", "options": ["British pound sterling", "US dollar", "Japanese yen", "Euro"], "answer": 1, "explanation": "The US dollar (USD) is the most heavily traded currency in the global foreign exchange (forex) markets.\n\n\n\nGlobal Reserve Currency: The USD is held as a reserve currency by central banks worldwide,\nmaking it the most liquid and widely used currency.\nForex Trading Volume: According to the Bank for International Settlements (BIS), the USD\naccounts for over 88% of global forex transactions.\nTrade & Commodity Pricing: The USD is the primary currency for global trade, oil pricing, and\ncommodity transactions.\nSafe Haven Currency: During economic uncertainty, investors move towards USD as a stable asset.\n# Reference: BIS Triennial Survey (2022), IMF Reports on Global Currency Reserves.", "zh": "国际市场交易最活跃的货币是什么？", "optionsZh": ["英镑", "美元", "日元", "欧元"], "explanationZh": "原解析强调美元在国际贸易、储备和外汇交易中的广泛使用。", "warning": ""}, {"id": 142, "q": "Stablecoins are less prone to price fluctuations because:", "options": ["They do not use blockchain technology", "Their price is in US Dollars", "Their value is pegged to underlying assets", "They are highly illiquid"], "answer": 2, "explanation": "Stablecoin Characteristics:\nStablecoins reduce price volatility by pegging their value to stable underlying assets like fiat\ncurrencies (e.g., USD) or commodities (e.g., gold).\nThis backing creates confidence in their value stability.\nElimination of Other Options:\nA: Stablecoins use blockchain technology.\nB: Pegging can occur in other currencies, not just USD.\nD: Stablecoins are designed for liquidity, contrary to being illiquid.\nReferences:\nICWIM Module 6: Explanation of cryptocurrency types and characteristics.", "zh": "稳定币为何通常价格波动较小？", "optionsZh": ["不使用区块链", "价格以美元计", "价值锚定底层资产", "流动性很低"], "explanationZh": "原解析认为锚定法币或其他资产可稳定目标价值，但不保证不会脱锚。", "warning": ""}, {"id": 143, "q": "One benefit of the Rules-Based model of regulation is that it:", "options": ["Evolves quickly in fast-changing dynamic markets", "Provides a source of guidance on how firms and individuals are expected to act", "Involves a high degree of prescriptive procedures and detailed rules, making it clear what individuals and firms must do to comply", "Offers a unique combination of private interests with government oversight"], "answer": 2, "explanation": "A Rules-Based model provides strict, prescriptive compliance requirements to ensure regulatory\nadherence.\nWhy is Option C Correct?\nIt removes ambiguity by outlining clear-cut rules that financial firms must follow.\nExample: The FCA’s Conduct of Business Sourcebook (COBS) provides detailed guidelines\non investment advice and suitability.\nWhy Not Other Options?\nA (Evolves quickly) # Rules-based systems are rigid and slow to adapt.\nB (Guidance) # A Principles-Based system (not Rules-Based) provides general guidance.\nD (Combination of interests) # This relates more to self-regulation models.\n# Reference: FCA Regulatory Framework, CISI Wealth & Investment Management.", "zh": "规则导向监管的优点是什么？", "optionsZh": ["快速适应市场变化", "提供一般行为指引", "详细具体的规则让合规要求更明确", "私人利益与政府监督独特结合"], "explanationZh": "规则导向通过明确程序与具体要求减少对行为标准的理解歧义。", "warning": ""}, {"id": 144, "q": "What causes the price of a closed-ended investment company to trade at a premium or discount to net asset value (NAV)?", "options": ["The level of charges within the fund", "The tax status of the fund", "Supply and demand", "Current level of interest rates"], "answer": 2, "explanation": "Price of Closed-Ended Investment Companies:\nThese companies issue a fixed number of shares. Prices can trade at a premium or discount to\nNAV based on market demand and supply for their shares.\nStrong demand increases prices above NAV (premium), while weak demand decreases prices\nbelow NAV (discount).\nElimination of Other Options:\nA: Charges affect long-term returns but not immediate pricing.\nB: Tax status is generally consistent and not a determinant of premiums or discounts.\nD: Interest rates indirectly affect demand but are not a direct cause.\nReferences:\nICWIM Module 3: Discussion on pricing mechanisms of closed-ended funds and NAV premiums\n/discounts.", "zh": "封闭式投资公司为何会相对净资产值出现溢价或折价？", "optionsZh": ["基金收费", "税务地位", "供求关系", "现行利率"], "explanationZh": "交易所价格由买卖供求决定，未必等于每份净资产值。", "warning": ""}, {"id": 145, "q": "The coupon on a bond has been expressed in real terms, rather than as a nominal amount. This is because:", "options": ["It is an inflation-linked bond", "Its redemption date is longer than 10 years", "It is an unsecured instrument", "It is a bearer bond"], "answer": 0, "explanation": "Real vs. Nominal Terms:\nInflation-linked bonds adjust their coupon payments and principal based on inflation rates.\nExpressing the coupon in real terms ensures it reflects purchasing power rather than face value.\n\n\n\nElimination of Other Options:\nB: Redemption date length is unrelated to coupon expression.\nC & D: Security type (unsecured/bearer) does not dictate coupon terms.\nReferences:\nICWIM Module 3: Explanation of bond types, including inflation-linked securities.", "zh": "为何某债券票息以实际价值而非名义金额表达？", "optionsZh": ["通胀挂钩债券", "到期超过十年", "无担保", "不记名债券"], "explanationZh": "原解析指通胀挂钩债券的本金或支付会按约定物价指数调整。", "warning": ""}, {"id": 146, "q": "A stockbroking firm receives both buy and sell orders for the same security but from different clients. How can they best avoid a conflict of interest?", "options": ["Withdraw their services for the transaction", "Place orders as they are received from the clients", "Openly disclose all orders received to the clients", "Process the sell orders before the buy orders"], "answer": 1, "explanation": "Avoiding Conflicts of Interest:\nBy placing orders in the order they are received, the firm ensures fairness and transparency.\nThis approach avoids any preferential treatment and complies with regulatory obligations.\nElimination of Other Options:\nA: Withdrawing services would not address the conflict and is impractical.\nC: Disclosing orders breaches confidentiality agreements.\nD: Prioritizing sell orders introduces bias and conflict.\nReferences:\nICWIM Module 5: Discussion on ethics and conflict of interest mitigation in trading.", "zh": "不同客户同时对同一证券下买单和卖单，怎样避免利益冲突？", "optionsZh": ["退出交易服务", "按收到指令顺序处理", "向客户公开全部订单", "先卖后买"], "explanationZh": "原解析强调公平、及时处理可比订单，不偏袒特定客户。", "warning": ""}, {"id": 147, "q": "A firm has an existing client who is the head of a foreign state. What type of due diligence should the firm undertake if the client's spouse applies to become a client?", "options": ["Simplified", "Standard", "Enhanced", "Additional"], "answer": 2, "explanation": "A client who is the spouse of the head of a foreign state is classified as a Politically Exposed Person (PEP).\nFirms are required to undertake enhanced due diligence (EDD) for PEPs and their immediate family\nmembers due to the increased risk of corruption, money laundering, or misuse of public funds.\nSimplified (A): This applies to low-risk clients, not PEPs.\nStandard (B): Standard due diligence is insufficient for PEPs or their relatives.\nAdditional (D): This term is not a formal category under anti-money laundering (AML) regulations.\nReferences:\nInternational Certificate in Wealth & Investment Management: AML procedures and the treatment of\nPEPs.\nFATF (Financial Action Task Force) guidelines on enhanced due diligence for politically exposed\npersons.", "zh": "现有客户为外国元首，其配偶申请开户，应做什么尽调？", "optionsZh": ["简化", "标准", "加强", "额外"], "explanationZh": "原解析认为 PEP 的配偶属于密切关联人士，应采用加强尽调框架。", "warning": ""}, {"id": 148, "q": "A company recently increased its earnings per share figure by 10%. This means that the company’s:", "options": ["Share base has widened", "Ability to pay dividends has improved", "Market share has risen", "P/E ratio has increased"], "answer": 1, "explanation": "An increase in earnings per share (EPS) indicates improved profitability on a per-share basis. This enhances\nthe company’s ability to distribute dividends to shareholders, assuming a consistent payout ratio.\nWidened share base (A): This would typically dilute EPS, not increase it.\nMarket share (C): Market share is unrelated to EPS; it is about the company’s competitive position.\nP/E ratio (D): While EPS affects valuation, a rise in EPS does not guarantee a P/E increase.\nReferences:\nInternational Certificate in Wealth & Investment Management: Financial ratios and their implications.\nEPS as a metric of profitability and dividend-paying capacity.", "zh": "公司每股收益提高 10%，意味着什么？", "optionsZh": ["股本扩大", "支付股息能力改善", "市场份额上升", "市盈率提高"], "explanationZh": "原解析将更高每股盈利与潜在派息能力联系起来；不等于股息必定增加。", "warning": ""}, {"id": 149, "q": "Setting standards for national anti-money laundering (AML) and counter-terrorist financing (CTF) programs and evaluating how effectively member countries have implemented the standards is the role of which of the following?", "options": ["International Monetary Fund (IMF)", "Interpol", "Financial Action Task Force (FATF)", "National Crime Agency"], "answer": 2, "explanation": "The Financial Action Task Force (FATF) is an intergovernmental organization that sets global AML\n/CTF standards and assesses compliance.\nWhy is Option C Correct?\nFATF develops recommendations that countries must implement to combat money laundering\nand terrorist financing.\nIt conducts peer reviews and blacklists non-compliant nations.\nWhy Not Other Options?\nA (IMF) # The IMF monitors economic stability, not AML enforcement.\nB (Interpol) # Handles criminal investigations, not financial regulations.\n\n\n\nD (National Crime Agency) # The NCA is UK-specific, while FATF is global.\n# Reference: FATF Guidelines, CISI Wealth & Investment Management.", "zh": "谁制定国家反洗钱与反恐融资标准并评估成员实施效果？", "optionsZh": ["国际货币基金组织", "国际刑警组织", "金融行动特别工作组", "国家犯罪调查局"], "explanationZh": "FATF 制定 AML／CTF 国际标准并开展相互评估。", "warning": ""}, {"id": 150, "q": "How does a negative interest rate policy aim to boost lending?", "options": ["Interest is not charged on loans", "Consumers are paid to borrow money", "By discounting the interest rate charged on loans", "By penalising banks for holding surplus cash"], "answer": 3, "explanation": "Understanding Negative Interest Rates:\nNegative interest rate policies (NIRP) are used by central banks to stimulate the economy by\ndiscouraging banks from hoarding excess reserves.\nUnder NIRP, banks are charged interest for holding deposits with the central bank, incentivizing\nlending to businesses and consumers instead.\nElimination of Other Options:\nA & B: Interest is still charged on loans, and consumers are not directly \"paid\" to borrow.\nC: Discounting loan interest rates is a potential consequence but not the direct mechanism of\nNIRP.\nReferences:\nICWIM Module 1: Economic Policy: Coverage of unconventional monetary policies like NIRP.", "zh": "负利率政策如何推动放贷？", "optionsZh": ["贷款免息", "借款人获得报酬", "贷款利率打折", "惩罚银行持有多余现金"], "explanationZh": "原解析强调持有超额准备金的成本，鼓励银行将资金用于放贷。", "warning": ""}, {"id": 151, "q": "If a company’s Economic Value Added (EVA) is negative, this means that:", "options": ["The rate of growth in the company’s value is slowing down", "The company’s value is being destroyed", "The rate of growth in the company’s value is below that of the sector average", "The company’s value is nil"], "answer": 1, "explanation": "Economic Value Added (EVA) measures a company’s true economic profit by assessing whether it\ngenerates returns above its cost of capital.\nEVA=Net Operating Profit After Tax (NOPAT)#(Capital Employed×Cost of Capital)EVA = \\text{Net\nOperating Profit After Tax (NOPAT)} - (\\text{Capital Employed} \\times \\text{Cost of Capital})\nEVA=Net Operating Profit After Tax (NOPAT)#(Capital Employed×Cost of Capital)\nWhy is Option B Correct?\nA negative EVA means the firm’s returns are lower than its cost of capital, leading to value\ndestruction.\nWhy Not Other Options?\nA (Slowing growth rate) # EVA measures profitability, not growth rate.\nC (Below sector average) # EVA is firm-specific, not a comparative measure.\nD (Value is nil) # A company may still be profitable, but inefficient.\n# Reference: CFA Institute (EVA Analysis), CISI Wealth & Investment Management.", "zh": "经济增加值 EVA 为负意味着什么？", "optionsZh": ["公司价值增长放缓", "公司价值被侵蚀", "价值增速低于行业", "公司价值为零"], "explanationZh": "经营回报不足以覆盖资本成本，表示该期间未创造相应经济价值，不等于企业价值归零。", "warning": ""}, {"id": 152, "q": "Equities have a higher risk/reward profile when compared to many other asset classes. Their use within a portfolio stems from:", "options": ["The potential to counter inflationary effects", "Their lower cost compared to other assets", "The ability to align liabilities with profits from equities", "Their low volatility when compared to bonds"], "answer": 0, "explanation": "Equities are often used to hedge against inflation because they represent ownership in real assets that can\ngrow in value. Companies generally have the ability to pass on inflationary costs to consumers, which can\npreserve or enhance their profitability and the equity value.\n\n\n\nLower cost (B): Equities may incur higher transaction and management costs than other asset classes.\nAlign liabilities (C): While equities offer returns, liability alignment is more relevant to fixed-income\nassets.\nLow volatility (D): Equities are more volatile than bonds or cash, making this statement incorrect.\nReferences:\nInternational Certificate in Wealth & Investment Management: Equities as inflation hedges and their\nrisk/reward profile.\nHistorical analysis of equity performance in inflationary periods.", "zh": "股票较高风险回报特征下，为何仍纳入组合？", "optionsZh": ["可能抵御通胀影响", "成本更低", "可用股票利润匹配负债", "比债券波动更低"], "explanationZh": "原解析强调股票长期增长潜力可能帮助抵御通胀，不是保证每期跑赢通胀。", "warning": ""}, {"id": 153, "q": "A company recently increased its earnings per share (EPS) figure by 10%. This means that the company's:", "options": ["Share base has widened", "Ability to pay dividends has improved", "Market share has risen", "P/E ratio has increased"], "answer": 1, "explanation": "Earnings per share (EPS) measures profitability per share. A higher EPS means a company has more\nearnings available for dividends or reinvestment.\nWhy is Option B Correct?\nAn increase in EPS improves the company’s ability to pay dividends, as there are more profits\navailable per share.\nWhy Not Other Options?\nA (Share base widened) # EPS is based on net income, not share count.\nC (Market share risen) # Higher EPS does not mean higher revenue or market share.\nD (P/E ratio increased) # The P/E ratio depends on share price movements, not just EPS.\n# Reference: CFA Institute (Earnings Analysis), CISI Wealth & Investment Management.", "zh": "每股收益 EPS 提高 10%，意味着什么？", "optionsZh": ["股本扩大", "派息能力改善", "市场份额上升", "市盈率提高"], "explanationZh": "每股盈利改善可支持潜在派息能力，但不能据此确定市盈率或实际股息变化。", "warning": ""}, {"id": 154, "q": "Which of the following will be a major constraint on a client’s ability to invest and protect against all risks?", "options": ["Age", "Affordability", "Risk aversion", "Tax implications"], "answer": 1, "explanation": "The biggest constraint on an investor’s ability to diversify and manage risk is their financial capacity\n(affordability).\nWhy is Option B Correct?\nInvesting requires capital, and affordability limits how much risk an investor can take.\nA client with low disposable income may not be able to diversify across multiple asset classes.\nWhy Not Other Options?\nA (Age) # Age affects time horizon, but affordability is a direct constraint.\nC (Risk aversion) # Risk aversion affects investment choices, not the ability to invest.\nD (Tax implications) # Tax affects returns but does not prevent investment.\n# Reference: CFA Institute (Investment Constraints), CISI Wealth & Investment Management.", "zh": "限制客户投资并保障全部风险的主要因素是什么？", "optionsZh": ["年龄", "负担能力", "风险厌恶", "税务影响"], "explanationZh": "可用预算有限，因此需要在投资和保障需求之间排序。", "warning": ""}, {"id": 155, "q": "In economics, costs are defined as:", "options": ["Opportunity", "Financial", "Normal profit", "Minimum efficient scale (MES)"], "answer": 0, "explanation": "Definition of Costs in Economics\nCosts in economics are defined as opportunity costs, which represent the value of the next best\nalternative foregone when a decision is made.\nExamples\nIf a business invests in Project A, the opportunity cost is the potential return from Project B,\nwhich was not pursued.\nWhy the Other Options are Incorrect\nB. Financial: Financial costs are explicit, but economics considers opportunity costs as broader.\nC. Normal Profit: Normal profit is a component of total costs but not the definition of \"costs\"\nitself.\nD. MES (Minimum Efficient Scale): Refers to the production scale at which average costs are\nminimized, unrelated to cost definition.\nICWIM Study Guide, Chapter on Economic Principles: Emphasizes opportunity cost as the core\ndefinition.\nEconomic Textbooks: Widely recognize opportunity cost as the key concept in cost theory.\nReferencesThus, the correct answer is A. Opportunity.", "zh": "经济学如何定义成本？", "optionsZh": ["机会成本", "财务成本", "正常利润", "最小有效规模"], "explanationZh": "机会成本是选择某方案所放弃的最佳替代方案的价值。", "warning": ""}, {"id": 156, "q": "What is a key feature of Islamic bonds (Sukuk)?", "options": ["The holder of the bond has partial ownership of the underlying assets", "The bond can only be linked to tangible assets in Islamic countries", "The holder of the bond has full ownership of the underlying assets", "The bond can only be linked to intangible assets in Islamic countries"], "answer": 0, "explanation": "Sukuk (Islamic bonds) comply with Sharia law, which prohibits interest (riba). Instead, Sukuk holders\nreceive returns based on asset ownership and profit-sharing agreements.\nWhy is Option A Correct?\n\n\n\nSukuk are asset-backed, meaning investors own a proportion of the underlying tangible assets.\nReturns are generated through leasing, profit-sharing, or joint ventures, rather than fixed\ninterest payments.\nWhy Not Other Options?\nB (Only Islamic countries) # Sukuk can be issued globally.\nC (Full ownership) # Sukuk holders share ownership, not full control.\nD (Intangible assets only) # Sukuk must be linked to tangible assets.\n# Reference: AAOIFI Sharia Standards, CISI Wealth & Investment Management (Islamic Finance).", "zh": "伊斯兰债券 Sukuk 的关键特点是什么？", "optionsZh": ["持有人拥有底层资产的部分权益", "只能对应伊斯兰国家有形资产", "持有人完全拥有底层资产", "只能对应伊斯兰国家无形资产"], "explanationZh": "原解析强调基于资产权益和符合伊斯兰金融原则的回报安排；具体权利依结构而异。", "warning": ""}, {"id": 157, "q": "Offshore foundations are often used as a suitable alternative to which similar type of arrangement?", "options": ["Limited liability partnerships", "Credit unions", "Trusts", "SICAVs"], "answer": 2, "explanation": "Offshore foundations are often considered alternatives to trusts, as both are used for wealth structuring, asset\nprotection, and estate planning. However, unlike trusts, foundations are independent legal entities and can\nprovide greater control to the founder.\nLimited liability partnerships (A): LLPs are business entities, not typically used for wealth\nmanagement.\nCredit unions (B): These are financial cooperatives, unrelated to wealth structuring.\nSICAVs (D): SICAVs are investment funds, not wealth-structuring vehicles.\nReferences:\nInternational Certificate in Wealth & Investment Management: Comparison of trusts and offshore\nfoundations in wealth management.\nLegal structures and their applications in estate and tax planning.", "zh": "离岸基金会常替代哪种类似安排？", "optionsZh": ["有限责任合伙", "信用合作社", "信托", "可变资本投资公司"], "explanationZh": "基金会和信托均可用于财富传承与安排；基金会通常具有独立法人结构。", "warning": ""}, {"id": 158, "q": "Which of the following is an example of a mandatory corporate action with options?", "options": ["Consolidation", "Rights issue", "Share buyback", "Takeover acceptance"], "answer": 1, "explanation": "# Reference: FCA Handbook (Corporate Actions), CISI Wealth & Investment Management.", "zh": "哪项属于附选择权的强制性公司行动？", "optionsZh": ["并股", "供股", "股份回购", "接受收购"], "explanationZh": "原题选择供股，反映其采用的公司行动分类。不同分类体系用语可能不同。", "warning": ""}, {"id": 159, "q": "Once an offshore foundation is established, who will normally be responsible for making ongoing decisions regarding the operational use of the foundation's assets?", "options": ["The board of directors", "The trustees", "The council", "The beneficiaries"], "answer": 2, "explanation": "Offshore Foundations\nThese legal entities are typically used for wealth preservation, estate planning, or philanthropic\npurposes.\nFoundations are managed by a council, which is responsible for operational decisions and\nensuring the foundation’s goals are met.\nWhy the Answer is C\nThe council acts similarly to a board of directors but focuses specifically on the foundation’s\nassets and objectives.\nWhy Other Options are Incorrect\n\n\n\nA. Board of directors: Applies to companies, not foundations.\nB. Trustees: Apply to trusts, not foundations.\nD. Beneficiaries: Beneficiaries do not have decision-making authority.\nICWIM Study Guide, Chapter on Trusts and Foundations: Discusses the governance of offshore\nfoundations.\nLegal Principles of Foundations: Confirms the role of the council.\nReferencesThus, the correct answer is C. The council.", "zh": "离岸基金会资产的持续运用由谁决定？", "optionsZh": ["董事会", "受托人", "理事会", "受益人"], "explanationZh": "Council 即理事会，负责基金会日常治理和资产运用决策。", "warning": ""}, {"id": 160, "q": "Measures of Central Tendency include a method whereby a set of numbers are multiplied and then the nth root of the resulting product is taken. This is known as the:", "options": ["Arithmetic mean", "Geometric mean", "Mode", "Median"], "answer": 1, "explanation": "The geometric mean is calculated using the formula:\nA math equation with numbers and symbols AI-generated content may be incorrect.\nUsed in Finance: The geometric mean is crucial in measuring compound returns over time.\nMore Accurate for Investments: It accounts for volatility in investment returns.\n# Reference: CFA Institute, CISI Wealth & Investment Management (Quantitative Methods).\n[Original contains a formula image. Refer to the source PDF for that image.]", "zh": "把所有数值相乘，再开 n 次方，叫什么？", "optionsZh": ["算术平均数", "几何平均数", "众数", "中位数"], "explanationZh": "几何平均数＝各数值乘积的 n 次方根；处理复合回报时通常对增长因子计算。", "warning": ""}, {"id": 161, "q": "How does the inclusion of a bond fund within a portfolio provide benefits over direct investing?", "options": ["A bond fund provides a greater level of income", "It allows for diversification that would not otherwise be possible", "Bond fund charges will always be lower", "A bond fund is more likely to match the exact needs of the client"], "answer": 1, "explanation": "Bond funds offer greater diversification than purchasing individual bonds, reducing risk exposure.\nWhy is Option B Correct?\nBroad diversification # A bond fund spreads investments across multiple issuers, reducing\ndefault risk.\nProfessional management # Bond fund managers actively manage interest rate risk and credit\nrisk.\nWhy Not Other Options?\nA (Greater income) # Bond funds do not always provide higher income than direct bonds.\nC (Lower charges) # Bond funds may have management fees that individual bonds do not.\nD (Exact match to client needs) # Individual bonds may be better suited for specific income\nneeds.\n# Reference: CFA Institute (Fixed Income Investing), CISI Wealth & Investment Management.", "zh": "债券基金相对直接买债券有什么优势？", "optionsZh": ["提供更高收入", "实现原本难以做到的分散投资", "收费始终更低", "一定更贴合客户需求"], "explanationZh": "集合资金可持有更多发行人的债券，降低集中风险，但不保证收益更高或收费更低。", "warning": ""}, {"id": 162, "q": "Once a company reaches the point known as the minimum efficient scale, the \"theory of the firm\" suggests that the company should:", "options": ["Halt its output expansion", "Accelerate its output expansion", "Increase its unit price", "Decrease its unit price"], "answer": 3, "explanation": "Minimum Efficient Scale:\nThis is the point where a company achieves the lowest average cost per unit due to economies of\nscale.\nOnce this level is reached, the firm can afford to lower prices to remain competitive and expand\nmarket share.\nElimination of Other Options:\nA: Halting expansion would waste the cost advantages achieved.\nB: Accelerating output expansion could lead to diseconomies of scale.\nC: Increasing unit prices is counterintuitive at this stage.\nReferences:\nICWIM Module 3: Coverage of cost structures and the theory of the firm.", "zh": "达到最小有效规模后，企业应该怎样？", "optionsZh": ["停止扩产", "加速扩产", "提高单价", "降低单价"], "explanationZh": "原解析认为成本效率改善可支持降价；但“达到 MES 就应降价”并非充分推论，原答案保留并标疑。", "warning": "达到最小有效规模不能单独推出企业必须降价。"}, {"id": 163, "q": "Last year’s monthly returns for Portfolio A were 7%, 5%, -3%, 5%, 9%, 0%, 3%, 6%, -7%, -8%, 5%, 1%. What was the portfolio’s modal rate of return to the nearest whole percentage point?", "options": ["0", "1", "2", "5"], "answer": 3, "explanation": "Understanding Modal Rate of Return:\nThe mode is the most frequently occurring value in a dataset.\nPortfolio A’s monthly returns: 7%, 5%, -3%, 5%, 9%, 0%, 3%, 6%, -7%, -8%, 5%, 1%.\n5% appears three times, more than any other value.\nElimination of Other Options:\nNo other return appears more than once.\n\n\n\nReferences:\nICWIM Module 3: Statistical measures in portfolio performance.", "zh": "月回报为 7%、5%、−3%、5%、9%、0%、3%、6%、−7%、−8%、5%、1%，众数是多少？", "optionsZh": ["0", "1", "2", "5"], "explanationZh": "5% 出现三次，次数最多，因此众数为 5%。", "warning": ""}, {"id": 164, "q": "What is the most likely effect on the demand curve of an increase in consumer preference for a good?", "options": ["A downward movement", "An upward movement", "A rightward shift", "A leftward shift"], "answer": 2, "explanation": "Effect of Increased Consumer Preference:\nWhen consumer preference for a good increases, demand rises at all price levels, leading to a\nrightward shift in the demand curve.\nThe rightward shift reflects higher quantity demanded at each price point.\nElimination of Other Options:\nA & B: Movements along the curve (upward or downward) occur due to price changes, not\npreference shifts.\nD: A leftward shift indicates reduced demand, contrary to the scenario presented.\nReferences:\nICWIM Module 3: Microeconomics: Demand and supply curve analysis.", "zh": "消费者对某商品偏好增强，需求曲线会怎样？", "optionsZh": ["向下移动", "向上移动", "向右平移", "向左平移"], "explanationZh": "偏好增强会增加各价格下的需求，属于整条曲线右移，而非沿曲线移动。", "warning": ""}, {"id": 165, "q": "An adviser is reviewing a client's portfolio, which has a time horizon of 15 years and is made up primarily of bonds and cash but with some exposure to equities and other higher-risk investments. It is reasonable to believe that the client's risk appetite is:", "options": ["Low Risk", "Low-Mid Risk", "Mid Risk", "Mid-High Risk"], "answer": 1, "explanation": "Risk appetite is determined by investment time horizon, asset allocation, and financial goals.\nWhy is Option B Correct?\nA 15-year time horizon allows for some exposure to risk, but a heavy allocation to bonds and\ncash suggests a conservative approach.\nThe presence of some equities implies a moderate willingness to take risk.\nWhy Not Other Options?\nA (Low risk) # A pure cash and bond portfolio would be low risk, but equities add some risk.\nC (Mid risk) # A balanced portfolio would have higher equity exposure.\nD (Mid-high risk) # A higher-risk portfolio would be equity-heavy.\n# Reference: CFA Institute (Risk Profiling), CISI Wealth & Investment Management.", "zh": "15 年期客户主要持债券现金、少量股票，其风险偏好可能是什么？", "optionsZh": ["低", "中低", "中", "中高"], "explanationZh": "原解析按保守配置选择中低；单凭资产结构不能完成正式风险评估。", "warning": ""}, {"id": 166, "q": "Which of the following underlies the pillars of risk tolerance?", "options": ["Psychological traits", "Sociological traits", "Education", "Experience"], "answer": 0, "explanation": "Risk tolerance is primarily determined by an investor’s psychological traits, such as their emotional\nresponse to financial risk.\nWhy is Option A Correct?\n\n\n\nInvestors’ decision-making processes are influenced by behavioral finance, emotions, and\ncognitive biases.\nSome investors are naturally risk-averse, while others are risk-seeking.\nWhy Not Other Options?\nB (Sociological traits) # Social factors may influence investment choices but do not define risk\ntolerance.\nC (Education) # Knowledge affects investment decisions, but risk tolerance is deeply personal.\nD (Experience) # Investors may gain confidence with experience, but core risk preferences\nremain psychological.\n# Reference: CFA Institute (Behavioral Finance & Risk Tolerance), CISI Wealth & Investment Management.", "zh": "风险容忍度的支柱主要基于什么？", "optionsZh": ["心理特质", "社会特质", "教育", "经验"], "explanationZh": "原解析强调情绪、认知偏差和心理特质对风险态度的影响。", "warning": ""}, {"id": 167, "q": "Critical illness cover will pay a lump sum in the event that a person suffers:", "options": ["Any critical illness", "A critical illness, however caused", "A closely defined critical illness", "A critical illness, provided they survive for 12 months"], "answer": 2, "explanation": "Critical Illness Cover (CIC) provides a lump sum payout if the policyholder is diagnosed with a covered\nillness. The policy specifies which conditions qualify for a payout.\nWhy is Option C Correct?\nPolicies list specific illnesses (e.g., cancer, stroke, heart attack) that qualify for coverage.\nIf an illness is not listed, no payout is made.\nWhy Not Other Options?\nA (Any critical illness) # Policies cover only certain conditions.\nB (However caused) # Coverage depends on medical definitions, not just cause.\n\n\n\nD (Survive for 12 months) # Most policies require survival for 14-30 days, not 12 months.\n# Reference: FCA Insurance Regulations, CISI Wealth & Investment Management (Protection Planning).", "zh": "重大疾病险在什么情况下支付一笔赔款？", "optionsZh": ["任何重病", "任何原因导致的重病", "合同明确定义的重病", "重病后存活十二个月"], "explanationZh": "须符合保单定义及理赔条件，并非所有自认为严重的疾病均受保。", "warning": ""}, {"id": 168, "q": "When deciding on an appropriate benchmark, why would an index be chosen?", "options": ["Because the client has stated that they are familiar with that particular index", "To avoid the difficulty of constructing a benchmark", "To remove any tracking error from the measurements", "If it represents a feasible investment alternative to the constructed portfolio"], "answer": 3, "explanation": "A benchmark is a reference point used to compare the performance of an investment portfolio. The chosen\nindex should accurately reflect the investment strategy and asset class.\nWhy is Option D Correct?\nA benchmark must represent a realistic investment alternative to compare against the portfolio.\nIf a portfolio invests in UK equities, an appropriate benchmark would be the FTSE 100 or\nFTSE All-Share Index.\nIf a portfolio invests globally, a relevant benchmark could be the MSCI World Index.\nWhy Not Other Options?\nA (Client familiarity) # While clients may know an index, this does not mean it is the best\nbenchmark.\nB (Avoiding difficulty) # Constructing a benchmark must be based on investment strategy, not\nconvenience.\nC (Removing tracking error) # No benchmark eliminates tracking error; it only measures it.\n# Reference: CFA Institute (Benchmark Selection), CISI Wealth & Investment Management.", "zh": "选择适当基准时，为什么选择某指数？", "optionsZh": ["客户熟悉该指数", "省去构建基准的麻烦", "消除跟踪误差", "指数代表该组合可行的替代投资"], "explanationZh": "基准应与策略及投资范围匹配，提供可比较的投资替代，不会自动消除跟踪误差。", "warning": ""}, {"id": 169, "q": "The supply curve for an industry would be expected to shift to the left if:", "options": ["Technology is introduced", "The price of raw materials decreased", "The price of raw materials increased", "Competition from firms entering the industry increased"], "answer": 2, "explanation": "The supply curve shifts left when production becomes more expensive or difficult.\nWhy Does a Leftward Shift Occur?\nIncreased raw material costs make production more expensive, leading to a reduction in\nsupply.\nHigher wages, taxes, or stricter regulations can also shift the supply curve left.\nWhat Causes a Rightward Shift?\nTechnological improvements lower costs and increase supply.\nLower raw material costs reduce production expenses, encouraging more supply.\n# Reference: CISI Wealth & Investment Management (Economic Principles), Microeconomics - Supply &\nDemand.", "zh": "什么会让行业供给曲线左移？", "optionsZh": ["引进技术", "原料降价", "原料涨价", "新企业进入使竞争增加"], "explanationZh": "原材料成本上涨，在同一价格下愿意供给的数量减少。", "warning": ""}, {"id": 170, "q": "Which factor forms the basis of an appropriateness test?", "options": ["Age", "Experience", "Qualifications", "Wealth"], "answer": 1, "explanation": "The appropriateness test, as outlined in financial regulations like MiFID II, evaluates whether a client has the\nnecessary knowledge and experience to understand the risks of a financial product or service. This is\nparticularly applicable when a client is investing in complex or non-advised products.\n\n\n\nAge (A): While relevant to certain suitability tests, age is not a determinant of appropriateness.\nQualifications (C): Although qualifications may indicate some level of understanding, they are not a\ncore requirement for the test.\nWealth (D): Wealth does not equate to investment knowledge or experience.\nReferences:\nInternational Certificate in Wealth & Investment Management: Section on MiFID II regulations and\nappropriateness tests.\nRegulatory guidelines for evaluating client risk understanding.", "zh": "适当性测试（appropriateness）的基础因素是什么？", "optionsZh": ["年龄", "经验", "学历资格", "财富"], "explanationZh": "原解析指知识和经验用于判断客户能否理解产品风险；不要与更全面的 suitability 混淆。", "warning": ""}, {"id": 171, "q": "A stockbroking firm receives buy and sell orders for the same security from different clients. How can they best avoid a conflict of interest?", "options": ["Withdraw their services for the transaction", "Place orders as they are received from the clients", "Openly disclose all orders received to the clients", "Process the sell orders before the buy orders"], "answer": 1, "explanation": "When a stockbroking firm receives buy and sell orders for the same security, they must ensure fair\nexecution to avoid conflicts of interest.\nBest Execution Principle:\nOrders should be executed in the order received (time priority).\nBrokers must act impartially and in the best interests of all clients.\nNo preferential treatment is allowed, even for higher-value orders.\nRegulatory Compliance:\nUnder MiFID II (Markets in Financial Instruments Directive) and FCA COBS rules, brokers\nmust ensure:\nTransparency in order handling.\n\n\n\nFair and prompt execution of trades.\nNo manipulation or front-running (trading ahead of clients).\nWhy Not Other Options?\nA (Withdraw their services) # This would disadvantage clients and is unnecessary.\nC (Openly disclose all orders) # Not required unless there is a material conflict of interest.\nD (Process sell orders before buy orders) # Would create an unfair trading practice.\n# Reference: FCA Handbook (COBS 11 - Best Execution), MiFID II Regulations, CISI Wealth & Investment\nManagement.", "zh": "收到不同客户对同一证券的买卖指令，如何避免利益冲突？", "optionsZh": ["退出服务", "按接收顺序处理", "公开全部客户订单", "先处理卖单"], "explanationZh": "原解析强调可比订单公平、有序处理，不能偏袒某个方向或客户。", "warning": ""}, {"id": 172, "q": "The concept of the Sharpe ratio is to measure the:", "options": ["Amount of performance attributable to a benchmark", "Return above a risk-free rate", "Effect the annual charge has on fund performance", "Ability of the fund manager in different scenarios"], "answer": 1, "explanation": "Sharpe Ratio Defined\nThe Sharpe ratio measures risk-adjusted return, specifically the excess return over the risk-free\nrate per unit of volatility.\nFormula: Sharpe Ratio=Portfolio Return - Risk-\nFree RateStandard Deviation of Portfolio Returns\\text{Sharpe Ratio} = \\frac{\\text{Portfolio\nReturn - Risk-Free Rate}}{\\text{Standard Deviation of Portfolio Returns}}\nSharpe Ratio=Standard Deviation of Portfolio ReturnsPortfolio Return - Risk-Free Rate\nWhy the Answer is B\nThe ratio quantifies the return generated for each unit of risk taken, relative to the risk-free rate.\nWhy Other Options are Incorrect\nA. Benchmark performance: The Sharpe ratio does not measure performance relative to a\nbenchmark.\n\n\n\nC. Annual charge effect: Unrelated to fund expenses.\nD. Manager ability: Focuses on risk-adjusted returns, not managerial skill.\nICWIM Study Guide, Chapter on Risk-Adjusted Metrics: Explains the Sharpe ratio.\nPortfolio Management Literature: Highlights its use in assessing performance.\nReferencesThus, the correct answer is B. Return above a risk-free rate.", "zh": "夏普比率衡量什么？", "optionsZh": ["归属于基准的表现", "超过无风险利率的回报", "年费对表现的影响", "经理在不同情境下的能力"], "explanationZh": "原题 B 最接近，但完整定义是每单位总波动对应的超额回报，即（组合回报−无风险利率）÷标准差。", "warning": "原选项 B 不完整；夏普比率还需要除以组合回报标准差。"}, {"id": 173, "q": "A manufacturing company has increased its level of output to the point where marginal costs start to exceed average total costs. What does this indicate?", "options": ["Fixed costs are likely to fall", "The market has become saturated", "Variable costs are now negligible", "Productive capacity is constrained"], "answer": 3, "explanation": "Marginal cost (MC) is the cost of producing one additional unit of output. When MC exceeds average\ntotal cost (ATC), the firm has reached capacity constraints and is experiencing diminishing returns.\nWhy is Option D Correct?\nAs production increases, bottlenecks occur due to limitations in machinery, labor, or materials.\nThis leads to higher variable costs per unit, making further expansion inefficient.\nWhy Not Other Options?\nA (Fixed costs fall) # Fixed costs remain constant, only spread over more units.\nB (Market saturation) # Rising costs do not indicate market conditions.\nC (Variable costs negligible) # Variable costs increase, not decrease.\n# Reference: Microeconomics - Cost Structures, CISI Wealth & Investment Management.", "zh": "产量提高到边际成本开始超过平均总成本，说明什么？", "optionsZh": ["固定成本将下降", "市场饱和", "可变成本可忽略", "产能受到限制"], "explanationZh": "原解析将成本上升与产能约束联系起来；仅凭 MC＞ATC 不能唯一证明产能受限，答案按原题保留。", "warning": "MC 高于 ATC 意味着 ATC 在该点上升，不能单独证明产能受到限制。"}, {"id": 174, "q": "The Financial Action Task Force (FATF) was created to:", "options": ["Improve financial regulation in G7 member states", "Support countries in developing their financial regulation", "Support international efforts to end safe havens for corrupt funds", "Combat international money laundering and international terrorism"], "answer": 3, "explanation": "Purpose of the FATF:\nEstablished in 1989, the FATF develops global policies to combat money laundering and terrorist\nfinancing.\nIt promotes international standards to ensure financial systems are not misused for criminal\npurposes.\nElimination of Other Options:\nA: The FATF’s mandate is broader than G7 financial regulation.\nB: It provides guidance but does not solely focus on developing financial regulation.\nC: Ending safe havens for corrupt funds is part of its mission but secondary to its primary goal of\ncombating money laundering and terrorism.\nReferences:\nICWIM Module 5: Focus on global financial regulation and anti-money laundering efforts.\nFATF Mandate (Official Publications): \"Standards for combating money laundering, terrorist\nfinancing, and proliferation financing.\"", "zh": "FATF 成立的目的是什么？", "optionsZh": ["改善 G7 金融监管", "帮助国家建立一般金融监管", "支持消除腐败资金避风港", "打击国际洗钱与恐怖主义"], "explanationZh": "原解析强调 FATF 打击洗钱和恐怖融资的国际标准工作；并涵盖相关扩散融资风险。", "warning": ""}];

</button>${session.mode==='practice'&&!show?`<button class="primary" id="submit" ${selected===undefined?'disabled':''}>提交本题</button>`:''}<button id="next" ${session.pos===session.ids.length-1?'disabled':''}>下一题 →</button></div></div></section><aside class="panel"><b>答题卡</b><div class="fine">已选 ${answered} / ${session.ids.length} 题</div><div class="progress"><div style="width:${answered/session.ids.length*100}%"></div></div><div class="grid" style="margin-top:18px">${session.ids.map((id,i)=>{const a=session.answers[id],s=revealed(Q(id));return `<button aria-label="跳转第 ${i+1} 题，原题 ${id}" class="${i===session.pos?'current':''} ${a!==undefined?'done':''} ${s?a===Q(id).answer?'good':'bad':''} ${session.flags.includes(id)?'flag':''}" data-pos="${i}">${i+1}</button>`}).join('')}</div><div class="legend">绿色底：已选 · 小圆点：待复习<br>提交后：绿为一致，红为不同或未答</div>${!session.finished?'<button class="primary" id="finish" style="width:100%;margin-top:20px">结束并查看成绩</button>':''}<div id="saveState" class="fine" style="margin-top:12px">${storageOK?'已自动保存':'请导出记录备份'}</div></aside></div>`;

function record(q){const a=session.answers[q.id];db.attempts[q.id]={choice:a??null,correct:a===q.answer,at:Date.now()}}
function finish(){if(!session||session.finished)return;session.finished=true;session.ended=Date.now();session.ids.forEach(id=>record(Q(id)));const correct=session.ids.filter(id=>session.answers[id]===Q(id).answer).length;db.history.unshift({at:session.ended,mode:session.mode,correct,total:session.ids.length,percent:Math.round(correct/session.ids.length*100)});db.history=db.history.slice(0,100);save();results()}
function results(){view='results';const correct=session.ids.filter(id=>session.answers[id]===Q(id).answer).length,pct=Math.round(correct/session.ids.length*100),warn=session.ids.filter(id=>Q(id).warning).length;const duration=Math.floor(((session.ended||Date.now())-session.started)/60000);$('#app').innerHTML=`<section class="hero"><div class="eyebrow">Session complete</div><h1>交卷完成，开始复盘。</h1><p class="muted">成绩依据原文件答案计算，不能替代正式考试评估。</p></section><section class="panel"><div class="resulthead"><div><div class="score">${pct}<span style="font-size:23px">%</span></div><p>${correct} / ${session.ids.length} 题与原答案一致 · 用时约 ${duration} 分钟</p></div><div><button class="primary" id="review">逐题看解析</button><button id="backHome">返回首页</button></div></div>${warn?`<div class="note">本场包含 ${warn} 道标疑题，计分仍保留原答案。建议重点查看提示，不要死记答案。</div>`:''}<div class="tools"><button data-filter="all">全部题目</button><button data-filter="wrong">答错与未答</button><button data-filter="flags">标记题</button><button id="export">导出学习记录</button></div><div class="resultslist">${session.ids.map((id,i)=>({q:Q(id),i})).filter(({q})=>resultFilter==='all'||resultFilter==='wrong'&&session.answers[q.id]!==q.answer||resultFilter==='flags'&&session.flags.includes(q.id)).map(({q,i})=>`<button class="resultrow" data-review="${i}"><b style="color:${session.answers[q.id]===q.answer?'var(--green)':'var(--red)'}">${session.answers[q.id]===q.answer?'✓':'✕'}</b><span><b>#${q.id}</b> ${esc(q.zh)}</span>${q.warning?'<span class="pill">标疑</span>':''}<span class="fine">查看 →</span></button>`).join('')||'<p class="muted">这个筛选下没有题目。</p>'}</div></section>`;$('#review').onclick=()=>{session.pos=0;renderQuiz()};$('#backHome').onclick=home;$('#export').onclick=exportData;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{resultFilter=b.dataset.filter;results()});document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{session.pos=Number(b.dataset.review);renderQuiz();window.scrollTo(0,0)})}
function updateTimer(){if(!session||session.finished)return;if(session.mode==='exam'){const remain=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));if($('#timer')){$('#timer').textContent=String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0');$('#timer').style.color=remain<300?'var(--red)':'var(--ink)'}if(!remain){if($('#confirm').open)$('#confirm').close();finish();toast('考试时间已到，已自动交卷。')}}else if($('#timer')){const sec=Math.floor((Date.now()-session.started)/1000);$('#timer').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}}
function exportData(){save();const blob=new Blob([JSON.stringify({format:'icwim-local-v1',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ICWIM-学习记录-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validData(d){if(!d||!Array.isArray(d.history)||!Array.isArray(d.stars)||!d.attempts||typeof d.attempts!=='object')return false;if(!d.stars.every(id=>Number.isInteger(id)&&Q(id)))return false;for(const [id,a] of Object.entries(d.attempts)){if(!Q(Number(id))||!a||typeof a.correct!=='boolean'||!(a.choice===null||Number.isInteger(a.choice)&&a.choice>=0&&a.choice<4))return false}const s=d.session;if(s){if(!['practice','exam'].includes(s.mode)||!Array.isArray(s.ids)||!s.ids.length||new Set(s.ids).size!==s.ids.length||!s.ids.every(id=>Number.isInteger(id)&&Q(id))||!Number.isInteger(s.pos)||s.pos<0||s.pos>=s.ids.length||!s.answers||!s.submitted||!Array.isArray(s.flags)||!s.flags.every(id=>s.ids.includes(id))||typeof s.finished!=='boolean'||!Number.isFinite(s.started)||s.mode==='exam'&&!Number.isFinite(s.deadline))return false;for(const [id,a] of Object.entries(s.answers))if(!s.ids.includes(Number(id))||!Number.isInteger(a)||a<0||a>3)return false}return d.history.every(h=>h&&Number.isFinite(h.at)&&['practice','exam'].includes(h.mode)&&Number.isInteger(h.total)&&h.total>0&&h.total<=174&&Number.isInteger(h.correct)&&h.correct>=0&&h.correct<=h.total&&Number.isFinite(h.percent))}
function importData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const f=JSON.parse(await input.files[0].text());if(f.format!=='icwim-local-v1'||!validData(f.data))throw Error();ask('导入学习记录？','导入会替换当前浏览器的记录。',()=>{db=f.data;session=db.session;save();home();toast('导入成功')})}catch(e){toast('文件格式不正确，请选择本面板导出的学习记录。')}};input.click()}
setInterval(updateTimer,1000);document.addEventListener('keydown',e=>{if(view!=='quiz'||e.target.matches('input,select,textarea')||$('#confirm').open)return;const q=activeQ();if('abcdABCD1234'.includes(e.key)&&e.key.length===1&&!revealed(q)){const i='1234'.includes(e.key)?Number(e.key)-1:letters.indexOf(e.key.toUpperCase());session.answers[q.id]=i;save();renderQuiz()}else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1)});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});window.addEventListener('pagehide',save);if(session&&!session.finished){renderQuiz()}else{home()}updateTimer();
</script></body></html>
